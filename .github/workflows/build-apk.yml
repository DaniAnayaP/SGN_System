name: Build downloadable APK

# Builds mobile-app/ into public/downloads/SGN-App.apk and commits the
# result, so the icon on Login.html always has a current build without
# anyone rebuilding it on their own machine. Runs in the cloud specifically
# to avoid the local disk-space problems a prior manual Android Studio
# build ran into.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    # This list must cover every source path mobile-app/sync-web-assets.js
    # reads from public/ (its own FILES array) -- confirmed live (2026-09-18)
    # that it had silently drifted out of sync with that array: an
    # AppInicio.css-only push matched none of these patterns (App*.html/
    # App*.js covered the other 2 file types per App screen, but no App*.css
    # entry existed), so the workflow never ran and the compiled APK kept
    # shipping a stale AppInicio.css for 2 pushes in a row before anyone
    # noticed. Also added the 3 other same-shaped gaps found alongside it
    # (menu.json, the 2 i18n files, the manifest icon) rather than patching
    # only the one that actually got hit this time.
    paths:
      - 'mobile-app/**'
      - 'public/Login.html'
      - 'public/Login.css'
      - 'public/login.js'
      - 'public/access-screen.js'
      - 'public/AppConfig.js'
      - 'public/ColorPalette.js'
      - 'public/AppOfflineSync.js'
      - 'public/PermissionTree.js'
      - 'public/Admin.css'
      - 'public/App*.html'
      - 'public/App*.js'
      - 'public/App*.css'
      - 'public/manifest.json'
      - 'public/sw.js'
      - 'public/data/menu.json'
      - 'public/i18n/**'
      - 'public/icons/icon-512.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.x hard-requires >=22 (confirmed live: "[fatal]
          # The Capacitor CLI requires NodeJS >=22.0.0" -- cap sync android
          # exits 1 immediately under 20, before touching anything else).
          node-version: 22

      # Refreshes the client-only App pages mobile-app/www copies from
      # public/ (see mobile-app/sync-web-assets.js's own comment for why
      # this list exists and what it deliberately excludes). Admin-only
      # pages like AppAdminInicio.js live directly in mobile-app/www
      # already and aren't touched by this step.
      - name: Sync web assets into the native app
        run: node mobile-app/sync-web-assets.js

      # Stamps a version that's actually unique to THIS build into the
      # Service Worker's own cache name -- confirmed live (2026-09-15) that
      # leaving CACHE_VERSION as a hardcoded literal here defeats sw.js's
      # own activate() cleanup (it only ever deletes caches whose name
      # DIFFERS from the current one, so a name that never changes across
      # builds never gets cleared, and the app keeps serving whatever
      # first got cached, forever). This only touches the checked-out copy
      # in this runner, never committed back -- the repo's own sw.js keeps
      # its plain literal for local/manual testing.
      - name: Stamp a unique Service Worker cache version
        run: sed -i "s/const CACHE_VERSION = '[^']*';/const CACHE_VERSION = 'sgn-app-shell-${{ github.run_id }}-${{ github.run_attempt }}';/" mobile-app/www/sw.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # @capacitor/android's own build.gradle hardcodes
          # sourceCompatibility/targetCompatibility to JavaVersion.VERSION_21
          # (confirmed in mobile-app/node_modules/@capacitor/android/capacitor/
          # build.gradle) -- javac fails with "invalid source release: 21"
          # under any older JDK.
          java-version: '21'

      - name: Install Capacitor CLI dependencies
        working-directory: mobile-app
        run: npm install

      - name: Sync the Capacitor Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x mobile-app/android/gradlew

      # Debug, not release: the project has never had a release signing
      # config (confirmed -- no keystore/key.properties anywhere in the
      # repo's history), every past "Publish rebuilt APK" commit shipped a
      # debug build. app/build.gradle's debug signingConfig now points at
      # the checked-in ci-debug.keystore instead of the implicit
      # $HOME/.android/debug.keystore, so this always signs with the same
      # key and installs cleanly as an update over the previous build.
      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug

      - name: Publish APK to downloads
        run: cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk public/downloads/SGN-App.apk

      - name: Commit the updated APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/SGN-App.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "Auto-rebuild downloadable APK [skip ci]"
            git push
          fi
