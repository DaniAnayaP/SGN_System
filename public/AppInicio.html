<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="home.title">SGN</title>
    <link rel="icon" href="icons/icon-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-512.png">
    <meta name="theme-color" content="#0b0d14">
    <link rel="stylesheet" href="AppInicio.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</head>
<body>
    <!-- Native-app-only home screen — reached after Acceder (Face ID or the
         app-branded password form, see access-screen.js). Not the desktop
         SaaS shell (Inicio-en.html/Dashboard.js) — a separate, minimal,
         mobile-first page. -->
    <main class="home-screen">
        <header class="home-header">
            <div class="home-header-top">
                <div class="home-client-brand">
                    <img class="home-client-logo" id="home-client-logo" src="icons/icon-512.png" alt="" hidden>
                    <span class="home-client-logo home-client-logo-fallback" id="home-client-logo-fallback"><i class="bx bx-buildings" aria-hidden="true"></i></span>
                    <span class="home-client-name" id="home-client-name">—</span>
                </div>
                <div class="home-header-top-actions">
                    <div class="home-picker-wrap">
                        <button type="button" class="home-pill-btn home-pill-btn-icon-only" id="home-dept-area-btn" aria-haspopup="true" aria-expanded="false" data-i18n-aria="home.deptAreaButton" aria-label="Depto/Área">
                            <i class="bx bx-buildings" aria-hidden="true"></i>
                            <i class="bx bx-chevron-down" aria-hidden="true"></i>
                        </button>
                        <div class="home-picker-dropdown" id="home-dept-area-dropdown" role="menu" hidden></div>
                    </div>
                    <div class="home-picker-wrap">
                        <button type="button" class="home-pill-btn" id="home-cost-centers-btn" aria-haspopup="true" aria-expanded="false">
                            <i class="bx bx-purchase-tag-alt" aria-hidden="true"></i>
                            <span id="home-cost-centers-label" data-i18n="home.costCentersButton">C. Cost</span>
                            <i class="bx bx-chevron-down" aria-hidden="true"></i>
                        </button>
                        <div class="home-picker-dropdown" id="home-cc-dropdown" role="menu" hidden></div>
                    </div>
                    <button type="button" class="home-hamburger-btn" id="home-search-btn" data-i18n-aria="sidebar.searchPlaceholder" aria-label="Search">
                        <i class="bx bx-search" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="home-hamburger-btn" id="home-hamburger-btn" aria-haspopup="true" aria-expanded="false">
                        <i class="bx bx-menu" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="home-hamburger-menu" id="home-hamburger-menu" role="menu" hidden>
                    <button type="button" role="menuitem" id="home-menu-messages">
                        <i class="bx bx-message" aria-hidden="true"></i> <span data-i18n="main.messages">Messages</span>
                    </button>
                    <button type="button" role="menuitem" id="home-menu-chatbot">
                        <i class="bx bx-bot" aria-hidden="true"></i> <span data-i18n="main.chatbot">Chatbot</span>
                    </button>
                    <button type="button" role="menuitem" id="home-menu-notifications">
                        <i class="bx bx-bell" aria-hidden="true"></i> <span data-i18n="main.notifications">Notifications</span>
                    </button>
                    <button type="button" role="menuitem" id="home-menu-bookmarks">
                        <i class="bx bx-bookmarks" aria-hidden="true"></i> <span data-i18n="main.bookmarks">Bookmarks</span>
                    </button>
                    <button type="button" role="menuitem" id="home-menu-settings" aria-haspopup="true" aria-expanded="false">
                        <i class="bx bx-cog" aria-hidden="true"></i> <span data-i18n="main.settings">Settings</span>
                        <i class="bx bx-chevron-down" aria-hidden="true" style="margin-left: auto;"></i>
                    </button>
                    <div class="home-menu-submenu" id="home-settings-submenu" hidden>
                        <button type="button" role="menuitem" id="home-menu-language">
                            <i class="bx bx-globe" aria-hidden="true"></i> <span data-i18n="main.language">Language</span>
                        </button>
                        <button type="button" role="menuitem" id="home-menu-style">
                            <i class="bx bx-palette" aria-hidden="true"></i> <span data-i18n="main.style">Style</span>
                        </button>
                        <button type="button" role="menuitem" id="home-menu-admin-business">
                            <i class="bx bx-shopping-bag" aria-hidden="true"></i> <span data-i18n="menu.adminBusiness">Admin Business</span>
                        </button>
                        <button type="button" role="menuitem" id="home-menu-button-config">
                            <i class="bx bx-slider-alt" aria-hidden="true"></i> <span data-i18n="main.buttonConfig">Button Settings</span>
                        </button>
                        <button type="button" role="menuitem" id="home-menu-database">
                            <i class="bx bx-data" aria-hidden="true"></i> <span data-i18n="menu.databaseGroup">Database</span>
                        </button>
                        <button type="button" role="menuitem" id="home-menu-business-intelligence">
                            <i class="bx bx-bulb" aria-hidden="true"></i> <span data-i18n="menu.businessIntelligenceGroup">Business Intelligence</span>
                        </button>
                        <button type="button" role="menuitem" id="home-menu-others">
                            <i class="bx bx-dots-horizontal-rounded" aria-hidden="true"></i> <span data-i18n="main.others">Others</span>
                        </button>
                    </div>
                    <button type="button" role="menuitem" id="home-menu-ui-scale">
                        <i class="bx bx-text" aria-hidden="true"></i> <span data-i18n="main.uiScale">System size</span>
                    </button>
                    <button type="button" role="menuitem" id="home-menu-user-info">
                        <i class="bx bx-user-circle" aria-hidden="true"></i> <span data-i18n="main.userInfo">User Data</span>
                    </button>
                    <button type="button" role="menuitem" id="home-menu-business-profile">
                        <i class="bx bx-briefcase" aria-hidden="true"></i> <span data-i18n="main.businessProfile">Business User Data</span>
                    </button>
                    <hr>
                    <button type="button" role="menuitem" class="home-menu-logout" id="home-menu-logout">
                        <i class="bx bx-log-out-circle" aria-hidden="true"></i> <span data-i18n="sidebar.logout">Log out</span>
                    </button>
                </div>
            </div>
            <div class="home-search-bar" id="home-search-bar" hidden>
                <i class="bx bx-search" aria-hidden="true"></i>
                <label for="home-search-input" class="sr-only" data-i18n="sidebar.searchPlaceholder">Search</label>
                <input id="home-search-input" type="search" data-i18n-placeholder="sidebar.searchPlaceholder" placeholder="Search" autocomplete="off">
            </div>
            <div class="home-header-greeting" id="home-header-greeting">
                <p class="home-hello" data-i18n="home.greeting">Hola,</p>
                <h1 class="home-name" id="home-user-name">—</h1>
            </div>
            <button type="button" class="home-header-collapse-toggle" id="home-header-collapse-toggle" aria-expanded="true" data-i18n-aria="main.topBarCollapse" aria-label="Collapse">
                <i class="bx bx-chevron-up" aria-hidden="true"></i>
            </button>
        </header>

        <section class="home-section">
            <h2 class="home-section-title" data-i18n="home.quickAccess">Accesos rápidos</h2>
            <div class="home-tiles" id="home-tiles">
                <!-- rendered at runtime from /api/business/app-screens -->
            </div>
            <div class="home-empty" id="home-empty" hidden>
                <i class="bx bx-mobile-alt" aria-hidden="true"></i>
                <p data-i18n="home.emptyMessage">Todavía no hay pantallas de App asignadas a tu cuenta.</p>
            </div>
        </section>

        <nav class="home-tabbar" id="home-tabbar" aria-label="Main navigation">
            <button type="button" class="home-tab active" id="home-tab-inicio" data-breadcrumb-key="home.tabHome">
                <i class="bx bx-home" aria-hidden="true"></i>
                <span data-i18n="home.tabHome">Inicio</span>
            </button>
            <button type="button" class="home-tab" id="home-tab-panel" data-breadcrumb-key="home.tabPanel">
                <i class="bx bx-grid-alt" aria-hidden="true"></i>
                <span data-i18n="home.tabPanel">Panel</span>
            </button>
            <button type="button" class="home-tab" id="home-tab-tablero" data-breadcrumb-key="home.tabBoard">
                <i class="bx bx-bar-chart-alt-2" aria-hidden="true"></i>
                <span data-i18n="home.tabBoard">Tablero</span>
            </button>
            <button type="button" class="home-tab" id="home-tab-catalogos" data-breadcrumb-key="home.tabCatalogs">
                <i class="bx bx-book-content" aria-hidden="true"></i>
                <span data-i18n="home.tabCatalogs">Catálogos</span>
            </button>
            <button type="button" class="home-tab" id="home-tab-operaciones" data-breadcrumb-key="home.tabOperations">
                <i class="bx bx-cog" aria-hidden="true"></i>
                <span data-i18n="home.tabOperations">Operaciones</span>
            </button>
            <button type="button" class="home-tab" id="home-tab-administracion" data-breadcrumb-key="home.tabAdmin">
                <i class="bx bx-briefcase" aria-hidden="true"></i>
                <span data-i18n="home.tabAdmin">Administración</span>
            </button>
            <button type="button" class="home-tab" id="home-tab-gestion" data-breadcrumb-key="home.tabManagement">
                <i class="bx bx-task" aria-hidden="true"></i>
                <span data-i18n="home.tabManagement">Gestión</span>
            </button>
            <button type="button" class="home-tab" id="home-tab-reportes" data-breadcrumb-key="home.tabReports">
                <i class="bx bx-file" aria-hidden="true"></i>
                <span data-i18n="home.tabReports">Reportes</span>
            </button>
            <button type="button" class="home-tab" id="home-tab-material-apoyo" data-breadcrumb-key="home.tabSupport">
                <i class="bx bx-help-circle" aria-hidden="true"></i>
                <span data-i18n="home.tabSupport">Material Apoyo</span>
            </button>
        </nav>

        <div class="home-breadcrumb" id="home-breadcrumb">
            <div class="home-breadcrumb-trail" id="home-breadcrumb-trail">
                <span data-i18n="home.breadcrumbHome">Inicio</span>
                <i class="bx bx-chevron-right" aria-hidden="true"></i>
                <span class="current" id="home-breadcrumb-current" data-i18n="home.tabHome">Inicio</span>
            </div>
            <button type="button" class="home-breadcrumb-toggle" id="home-breadcrumb-toggle" data-i18n-aria="main.breadcrumbCollapse" aria-label="Collapse">
                <i class="bx bx-map-alt" aria-hidden="true"></i>
                <i class="bx bx-chevron-up" aria-hidden="true" id="home-breadcrumb-toggle-chevron"></i>
            </button>
        </div>
    </main>

    <div class="home-toast-container" id="home-toast-container" aria-live="polite"></div>

    <div class="home-sheet-overlay" id="home-ui-scale-overlay" hidden>
        <div class="home-sheet" role="dialog" aria-modal="true" aria-labelledby="home-ui-scale-title">
            <div class="home-sheet-handle"></div>
            <h3 class="home-sheet-title" id="home-ui-scale-title" data-i18n="main.uiScale">System size</h3>
            <p class="home-sheet-subtitle" data-i18n="home.uiScaleSubtitle">Adjust your App's text and icon size.</p>
            <div class="home-ui-scale-preview">
                <span class="home-ui-scale-preview-text" id="home-ui-scale-preview-text">Aa</span>
                <p class="home-ui-scale-preview-label" data-i18n="home.uiScalePreview">Preview</p>
            </div>
            <div class="home-ui-scale-stepper">
                <button type="button" class="home-ui-scale-btn" id="home-ui-scale-decrease" data-i18n-aria="main.uiScaleDecrease" aria-label="Decrease size">
                    <i class="bx bx-minus" aria-hidden="true"></i>
                </button>
                <div class="home-ui-scale-value">
                    <p class="home-ui-scale-label" id="home-ui-scale-label">Ideal</p>
                    <p class="home-ui-scale-percent" id="home-ui-scale-percent">100%</p>
                </div>
                <button type="button" class="home-ui-scale-btn home-ui-scale-btn-accent" id="home-ui-scale-increase" data-i18n-aria="main.uiScaleIncrease" aria-label="Increase size">
                    <i class="bx bx-plus" aria-hidden="true"></i>
                </button>
            </div>
            <div class="home-ui-scale-dots" id="home-ui-scale-dots"></div>
        </div>
    </div>

    <script src="AppInicio.js" defer></script>
</body>
</html>
