<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Artículo</title>
    <link rel="icon" href="icons/icon-512.png">
    <style>
        :root{
            --bg:#f3f4fa; --surface:#ffffff; --border:#e0e3f0;
            --text-primary:#1c1f30; --text-secondary:#454a68; --text-muted:#8890ac;
            --accent-1:#6C7CF0; --accent-2:#3A4BC9;
        }
        *{ box-sizing:border-box; }
        body{ margin:0; background:var(--bg); color:var(--text-primary); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
        .wrap{ max-width:640px; margin:0 auto; min-height:100vh; background:var(--surface); }
        .brand{ display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border); }
        .brand-mark{ width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
            display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:13px; flex:none; }
        .brand-name{ font-size:13px; font-weight:700; color:var(--text-secondary); }
        .photos{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:16px; }
        .photo{ aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--bg); display:flex; align-items:center; justify-content:center; }
        .photo.main{ grid-column:span 3; aspect-ratio:4/3; }
        .photo img{ width:100%; height:100%; object-fit:cover; display:block; }
        .photo.empty{ color:var(--text-muted); font-size:24px; }
        .info{ padding:4px 20px 20px; }
        .info h1{ font-size:19px; font-weight:800; margin:0 0 4px; }
        .info .sub{ font-size:12.5px; color:var(--text-muted); margin:0 0 16px; }
        .spec{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
        .spec span:first-child{ color:var(--text-muted); }
        .spec span:last-child{ font-weight:600; text-align:right; }
        .footer{ padding:14px 20px 26px; font-size:11px; color:var(--text-muted); text-align:center; }
        .state{ padding:60px 24px; text-align:center; color:var(--text-muted); font-size:14px; }
    </style>
</head>
<body>
    <div class="wrap" id="wrap">
        <div class="state" id="loading-state">Cargando…</div>
    </div>
    <script src="Ficha.js"></script>
</body>
</html>
