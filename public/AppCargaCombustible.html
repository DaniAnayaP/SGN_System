<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="menu.opTransVolCargaCombustible">Fuel Loading</title>
    <link rel="icon" href="icons/icon-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-512.png">
    <meta name="theme-color" content="#0b0d14">
    <link rel="stylesheet" href="AppInicio.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body>
    <!-- Native App screen for Carga Combustible — a practical, one-field-at-
         a-time form instead of Sistema Web's table (see OpTransVolCargaCombustible.html
         for the desktop version of this same data). Reuses AppInicio.css's
         subscreen shell (header/back/body) since this is conceptually a
         focused single-purpose view, same as Datos de Usuario etc. Two
         screens share this one page: the list of active (not-yet-closed)
         cargas + "+ Nueva Carga", and the field-by-field form for whichever
         carga is open (see AppCargaCombustible.js). -->
    <div class="home-screen">
        <div class="home-subscreen">
            <div class="home-subscreen-header home-carga-header">
                <div class="home-carga-header-top">
                    <button type="button" class="home-subscreen-back" id="carga-back" data-i18n-aria="admin.back" aria-label="Back">
                        <i class="bx bx-arrow-back" aria-hidden="true"></i>
                    </button>
                    <h2 data-i18n="menu.opTransVolCargaCombustible" id="carga-title">Fuel Loading</h2>
                </div>
                <div class="home-carga-progress-track" id="carga-progress-track" hidden>
                    <div class="home-carga-progress-fill" id="carga-progress-fill"></div>
                </div>
                <p class="home-carga-progress-label" id="carga-progress-label" hidden></p>
            </div>
            <div class="home-subscreen-body" id="carga-body"></div>
        </div>
    </div>

    <div class="home-toast-container" id="home-toast-container"></div>

    <script src="ColorPalette.js"></script>
    <script src="AppOfflineSync.js"></script>
    <script src="AppCargaCombustible.js" defer></script>
</body>
</html>
