<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Layout</title>
    <link rel="icon" href="/icons/icon-512.png">
    <style>
        :root{
            --bg:#f3f4fa; --surface:#ffffff; --border:#e0e3f0;
            --text-primary:#1c1f30; --text-secondary:#454a68; --text-muted:#8890ac;
            --accent-1:#6C7CF0; --accent-2:#3A4BC9;
        }
        *{ box-sizing:border-box; }
        body{ margin:0; background:var(--bg); color:var(--text-primary); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
        .wrap{ max-width:900px; margin:0 auto; min-height:100vh; background:var(--surface); }
        .brand{ display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--brand-line, var(--border)); }
        .brand-mark{ width:32px; height:32px; border-radius:8px; background:var(--brand, linear-gradient(135deg,var(--accent-1),var(--accent-2)));
            display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:13px; flex:none; }
        .brand-name{ font-size:13px; font-weight:700; color:var(--text-secondary); }
        .brand-names{ display:grid; gap:1px; min-width:0; }
        .brand-kind{ font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--brand-ink, var(--text-muted)); line-height:1.2; }
        .brand-meta{ margin-top:3px; font-size:10.5px; color:var(--text-muted); line-height:1.3; }
        .brand-site{ font-size:16px; font-weight:800; color:var(--brand, var(--accent-2)); line-height:1.2; }
        .brand-name.weak{ font-size:10.5px; font-weight:600; color:var(--text-muted); letter-spacing:.03em; text-transform:uppercase; line-height:1.25; }
        .brand-logo{ height:34px; max-width:120px; object-fit:contain; flex:none; }
        .catbanner{ display:flex; gap:12px; align-items:flex-start; margin:12px 16px 0; padding:12px 14px; border:1px solid var(--brand-line, var(--border)); border-left:6px solid; border-radius:10px; background:var(--brand-soft, #fff); }
        .catmark{ width:42px; height:42px; border-radius:10px; display:grid; place-items:center; flex:none; }
        .cattitle{ font-size:16px; font-weight:800; color:var(--brand-ink, var(--text-primary)); }
        .catsub{ font-size:12.5px; color:var(--text-muted); }
        .catnote{ margin:8px 0 0; font-size:12.5px; color:var(--text-secondary); }
        .info{ padding:16px 20px 8px; }
        .info h1{ font-size:19px; font-weight:800; margin:0 0 4px; color:var(--brand-ink, var(--text-primary)); }
        .info .sub{ font-size:12.5px; color:var(--text-muted); margin:0; }
        .map{ position:relative; margin:12px 16px; border:1px solid var(--brand-line, var(--border)); border-radius:10px; overflow:hidden; background:#fff; }
        .map svg{ display:block; width:100%; height:auto; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
        .map.zoomed svg{ cursor:grab; }
        .map.zoomed svg:active{ cursor:grabbing; }
        .map-tools{ position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:6px; z-index:2; }
        .map-tools button{ width:36px; height:36px; display:grid; place-items:center; padding:0; border:1px solid var(--brand-line, var(--border)); border-radius:999px; background:#fff; color:var(--brand-ink, var(--text-primary)); cursor:pointer; box-shadow:0 1px 4px rgba(20,22,31,.16); }
        .map-tools button:focus-visible{ outline:2px solid var(--brand, var(--accent-2)); outline-offset:2px; }
        .map-tools button[hidden]{ display:none; }
        .map-tools svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
        .kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:0 16px; }
        @media (min-width:640px){ .kpis{ grid-template-columns:repeat(3,1fr); } }
        .kpi{ border:1px solid var(--brand-line, var(--border)); background:var(--brand-soft, transparent); border-radius:10px; padding:8px 12px; }
        .kpi b{ display:block; font-size:16px; font-variant-numeric:tabular-nums; color:var(--brand-ink, var(--text-primary)); }
        .kpi span{ font-size:11.5px; color:var(--text-muted); }
        button.kpi{ font:inherit; text-align:left; cursor:pointer; color:inherit; width:100%; }
        button.kpi:focus-visible, .mbtn:focus-visible, .back:focus-visible{ outline:2px solid var(--brand, var(--accent-2)); outline-offset:2px; }
        button.kpi[aria-pressed="true"]{ border-color:var(--brand, var(--accent-2)); box-shadow:0 0 0 1.5px var(--brand, var(--accent-2)); background:#fff; }
        .kpis{ padding-top:6px; }
        .back{ display:inline-flex; align-items:center; gap:6px; padding:14px 20px 0; font-size:13px; font-weight:700; color:var(--brand, var(--accent-2)); text-decoration:none; }
        .mbtn{ display:flex; align-items:center; gap:12px; width:calc(100% - 32px); margin:4px 16px 12px; padding:12px 14px; border:1.5px solid var(--brand, var(--accent-2)); border-radius:12px; background:var(--brand-soft, #fff); color:var(--brand-ink, var(--text-primary)); text-decoration:none; font:inherit; text-align:left; cursor:pointer; }
        .mbtn svg{ width:22px; height:22px; stroke:var(--brand, var(--accent-2)); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
        .mbtn .t{ flex:1; display:grid; }
        .mbtn .t b{ font-size:15px; font-weight:800; }
        .mbtn .t small{ font-size:12px; color:var(--text-secondary); }
        .mbtn .go{ color:var(--text-muted); font-size:18px; transition:transform .15s; }
        .mbtn[aria-expanded="true"] .go{ transform:rotate(90deg); }
        .zlist[hidden]{ display:none; }
        .zlist{ margin:-4px 16px 12px; border:1px solid var(--brand-line, var(--border)); border-radius:12px; overflow:hidden; }
        .zhead, .zrow{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 78px 10px; align-items:center; gap:8px; padding:11px 14px; }
        .zhead{ padding-block:8px; border-bottom:1.5px solid var(--brand-line, var(--border)); font-size:11px; font-weight:700; color:var(--text-muted); }
        .zrow{ border-bottom:1px solid var(--brand-line, var(--border)); font-size:13.5px; }
        .zrow:last-child{ border-bottom:0; }
        .zrow b{ font-size:14.5px; overflow-wrap:anywhere; }
        .zk{ color:var(--text-secondary); font-size:13px; overflow-wrap:anywhere; }
        .zc{ color:var(--text-muted); font-size:12.5px; white-space:nowrap; text-align:right; }
        .zc i{ font-style:normal; font-weight:800; color:var(--brand-ink, var(--text-primary)); font-variant-numeric:tabular-nums; font-size:14px; }
        .hbtn{ margin-left:auto; width:36px; height:36px; display:grid; place-items:center; flex:none; border:1px solid var(--brand-line, var(--border)); border-radius:999px; background:#fff; color:var(--brand, var(--accent-2)); text-decoration:none; }
        .hbtn svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .hbtn:focus-visible, .crumbs a:focus-visible, a.zrow:focus-visible, .crow:focus-visible{ outline:2px solid var(--brand, var(--accent-2)); outline-offset:2px; }
        .crumbs{ display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; padding:12px 20px 0; font-size:12.5px; color:var(--text-muted); }
        .crumbs a{ color:var(--brand, var(--accent-2)); font-weight:600; text-decoration:none; }
        .crumbs b{ color:var(--text-primary); }
        a.zrow{ color:inherit; text-decoration:none; }
        a.zrow .go{ color:var(--text-muted); }
        .crow{ display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--brand-line, var(--border)); color:inherit; text-decoration:none; }
        .crow .ctx{ flex:1; display:grid; min-width:0; }
        .crow .ctx b{ font-size:14px; }
        .crow .ctx small{ font-size:12px; color:var(--text-muted); }
        .crow .go{ color:var(--text-muted); }
        .cmark.sm{ width:34px; height:34px; border-radius:9px; display:grid; place-items:center; flex:none; }
        .emptynote{ margin:6px 20px 0; font-size:12.5px; color:var(--text-muted); }
        .maptools-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin:12px 16px 0; }
        .ricons{ display:flex; gap:8px; }
        .ricon{ width:36px; height:36px; display:grid; place-items:center; padding:0; border:1px solid var(--brand-line, var(--border)); border-radius:999px; background:#fff; color:var(--brand, var(--accent-2)); cursor:pointer; }
        .ricon svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .ricon .slash{ display:none; }
        .ricon[aria-pressed="false"] .slash{ display:block; }
        .ricon[aria-pressed="false"]{ color:var(--text-muted); }
        .lpills{ display:flex; flex-wrap:wrap; gap:6px; }
        .lpill{ font:inherit; font-size:12px; padding:5px 12px; border-radius:999px; border:1px solid var(--brand-line, var(--border)); background:#fff; color:var(--brand-ink, var(--text-primary)); cursor:pointer; }
        .lpill[aria-pressed="true"]{ background:var(--brand, var(--accent-2)); border-color:var(--brand, var(--accent-2)); color:#fff; font-weight:700; }
        .lpill[aria-disabled="true"]{ cursor:default; }
        .ricon:focus-visible, .lpill:focus-visible{ outline:2px solid var(--brand, var(--accent-2)); outline-offset:2px; }
        .ricon[aria-expanded="true"]{ background:var(--brand-soft, #eef0fd); border-color:var(--brand, var(--accent-2)); box-shadow:0 0 0 1.5px var(--brand, var(--accent-2)); }
        .spanel[hidden]{ display:none; }
        .spanel{ margin:10px 16px 0; }
        .sbox{ display:flex; align-items:center; gap:8px; padding:9px 12px; border:1.5px solid var(--brand, var(--accent-2)); border-radius:14px; background:#fff; }
        .sbox:focus-within{ box-shadow:0 0 0 2px var(--brand-line, var(--border)); }
        .sbox svg{ width:18px; height:18px; stroke:var(--brand, var(--accent-2)); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
        .sbox input{ flex:1; width:0; min-width:0; border:0; outline:0; font:inherit; font-size:16px; color:var(--text-primary); background:transparent; -webkit-appearance:none; appearance:none; }
        .sbox input::placeholder{ color:var(--text-muted); }
        .sbox input::-webkit-search-cancel-button, .sbox input::-webkit-search-decoration{ -webkit-appearance:none; display:none; }
        .sx{ width:24px; height:24px; flex:none; border:0; border-radius:50%; background:var(--brand-soft, #eef0fd); color:var(--brand, var(--accent-2)); font-size:15px; line-height:1; cursor:pointer; padding:0; }
        .sx[hidden]{ display:none; }
        .sx:focus-visible, .slink:focus-visible, .sscope button:focus-visible, a.res:focus-visible{ outline:2px solid var(--brand, var(--accent-2)); outline-offset:2px; }
        .schips{ display:flex; gap:6px; padding-top:10px; overflow-x:auto; }
        .schips .lpill{ flex:none; }
        .sscope{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding-top:8px; font-size:11.5px; color:var(--text-muted); }
        .sscope button{ font:inherit; font-size:11.5px; border:1px solid var(--brand-line, var(--border)); background:var(--brand-soft, #fff); color:var(--brand-ink, var(--text-primary)); border-radius:999px; padding:2px 10px; cursor:pointer; }
        .sres{ margin-top:4px; }
        .shint, .sempty{ margin:14px 16px 0; font-size:12.5px; color:var(--text-secondary); }
        .sempty{ padding:12px; border:1px dashed var(--brand-line, var(--border)); border-radius:10px; background:var(--brand-soft, #fbfbfe); }
        .slink{ font:inherit; font-weight:700; border:0; background:none; color:var(--brand, var(--accent-2)); text-decoration:underline; cursor:pointer; padding:0; }
        .sgrp{ display:flex; justify-content:space-between; align-items:baseline; margin:14px 16px 2px; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--brand-ink, var(--text-primary)); }
        .sgrp small{ font-weight:600; letter-spacing:0; text-transform:none; color:var(--text-muted); }
        a.res{ display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid var(--brand-line, var(--border)); color:inherit; text-decoration:none; }
        .res .m{ width:32px; height:32px; border-radius:9px; display:grid; place-items:center; flex:none; }
        .res .m svg{ width:17px; height:17px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .res .t{ flex:1; display:grid; min-width:0; }
        .res .t b{ font-size:13.5px; overflow-wrap:anywhere; }
        .res .t small{ font-size:11.5px; color:var(--text-muted); overflow-wrap:anywhere; }
        .res .t small .where{ color:var(--brand-ink, var(--text-primary)); }
        .res .go{ color:var(--text-muted); }
        .smore{ margin:6px 16px 0; font-size:11.5px; color:var(--text-muted); }
        mark{ background:var(--brand-soft, #fff3b0); color:inherit; border-radius:3px; padding:0 1px; box-shadow:0 0 0 1px var(--brand-line, #f1df7c); }
        mark.aux{ background:transparent; box-shadow:0 0 0 1px var(--brand-line, #f1df7c); }
        .searching .zextra{ display:none; }
        .nomap .map, .nomap .mpanel{ display:none; }
        /* Vista 3D (LayoutScene3D.js): ocupa el lugar del croquis; en 3D se van los botones que solo sirven en 2D y sale la pastilla de las paredes */
        .only3d{ display:none; }
        .mode3d .only3d{ display:inline-block; }
        .mode3d .no3d{ display:none; }
        .m3d-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px; }
        .m3d-gap{ flex:1; }
        .m3d-stage{ position:relative; width:100%; aspect-ratio:700 / 460; min-height:240px; background:var(--brand-soft, #eef0fd); }
        .m3d-stage .layout-3d-canvas{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
        .m3d-stage .layout-3d-canvas:active{ cursor:grabbing; }
        .m3d-msg{ position:absolute; inset:0; display:grid; place-items:center; padding:16px; text-align:center; font-size:13px; color:var(--text-muted); z-index:1; }
        .m3d-msg[hidden]{ display:none; }
        .m3d-info{ margin:8px; padding:8px 10px; border:1px solid var(--brand-line, var(--border)); border-radius:8px; font-size:13px; line-height:1.4; background:#fff; }
        .m3d-info[hidden]{ display:none; }
        .m3d-picker{ margin:0 8px 8px; }
        .m3d-picker .lap{ max-height:300px; }
        .ricon.filtered{ background:var(--brand-soft, #eef0fd); border-color:var(--brand, var(--accent-2)); }
        .ricon:disabled{ opacity:.4; cursor:default; }
        /* Barra del croquis: búsqueda chica + 2D | 3D, "Mostrar" y el cuadro con las opciones del modo elegido */
        .toprow{ display:flex; align-items:center; gap:8px; margin:12px 16px 0; }
        .toprow .sbar{ flex:1 1 0; padding:8px 14px; border-radius:999px; font-size:13px; }
        .toprow .sbar .t{ display:none; }
        .toprow .sbar .go{ font-size:13px; font-weight:600; color:var(--text-muted); }
        .toprow .sbar .go.on{ color:var(--brand, var(--accent-2)); }
        .seg{ display:flex; flex:none; border:1.5px solid var(--brand, var(--accent-2)); border-radius:999px; overflow:hidden; }
        .seg button{ font:inherit; font-size:13px; font-weight:700; padding:8px 15px; border:0; background:#fff; color:var(--brand, var(--accent-2)); cursor:pointer; }
        .seg button[aria-pressed="true"]{ background:var(--brand, var(--accent-2)); color:#fff; }
        .seg button:focus-visible{ outline:2px solid var(--brand, var(--accent-2)); outline-offset:-3px; }
        .showrow{ display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin:9px 16px 0; font-size:11px; color:var(--text-muted); }
        .cchip{ font:inherit; font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--brand-line, var(--border)); background:#fff; color:var(--brand-ink, var(--text-primary)); cursor:pointer; }
        .cchip[aria-pressed="true"]{ background:var(--brand-soft, #eef0fd); border-color:var(--brand, var(--accent-2)); }
        .cchip[aria-pressed="true"]::before{ content:"✓ "; font-weight:700; color:var(--brand, var(--accent-2)); }
        .cchip:focus-visible, .mtool:focus-visible{ outline:2px solid var(--brand, var(--accent-2)); outline-offset:2px; }
        .mpanel{ margin:10px 16px 0; padding:10px 11px 12px; border:1px solid var(--brand-line, var(--border)); border-radius:16px; background:var(--brand-soft, #eef0fd); }
        .mptitle{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px; color:var(--brand, var(--accent-2)); }
        .mptitle i{ font-style:normal; font-size:10px; font-weight:700; letter-spacing:.08em; padding:1px 8px; border-radius:999px; background:var(--brand, var(--accent-2)); color:#fff; }
        .mgl{ margin:9px 0 5px; font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); }
        .mpills{ display:flex; flex-wrap:wrap; gap:5px; }
        .mtools{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
        .mtool{ font:inherit; display:grid; justify-items:center; align-content:start; gap:3px; padding:0; border:0; background:none; font-size:10.5px; line-height:1.2; text-align:center; color:var(--brand-ink, var(--text-primary)); cursor:pointer; }
        .mtool .ic{ width:36px; height:36px; display:grid; place-items:center; border:1px solid var(--brand-line, var(--border)); border-radius:50%; background:#fff; color:var(--brand, var(--accent-2)); }
        .mtool .ic svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .mtool .slash{ display:none; }
        .mtool[aria-pressed="false"] .slash{ display:block; }
        .mtool[aria-pressed="false"] .ic{ color:var(--text-muted); }
        .mtool[aria-pressed="true"] .ic{ background:var(--brand, var(--accent-2)); border-color:var(--brand, var(--accent-2)); color:#fff; }
        .mtool[aria-expanded="true"] .ic, .mtool.filtered .ic{ background:var(--brand-soft, #eef0fd); border-color:var(--brand, var(--accent-2)); box-shadow:0 0 0 1.5px var(--brand, var(--accent-2)); }
        .mtool:disabled{ opacity:.4; cursor:default; }
        .mpanel .m3d-picker{ margin:8px 0 0; }
        /* arriba: la barra Buscar de ancho completo y el grupo Croquis (todo lo demás; al ocultar el croquis se van los del dibujo) */
        .sbar{ flex:1 1 100%; display:flex; align-items:center; gap:10px; min-width:0; padding:10px 14px; border:1.5px solid var(--brand, var(--accent-2)); border-radius:14px; background:#fff; color:var(--text-muted); font:inherit; font-size:14px; text-align:left; cursor:pointer; }
        .sbar svg{ width:18px; height:18px; stroke:var(--brand, var(--accent-2)); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
        .sbar .t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .sbar .go{ flex:none; font-size:11.5px; font-weight:700; color:var(--brand, var(--accent-2)); white-space:nowrap; }
        .sbar .go.on, .sbar[aria-expanded="true"] .go.off{ display:none; }
        .sbar[aria-expanded="true"] .go.on{ display:inline; }
        .sbar[aria-expanded="true"]{ background:var(--brand-soft, #eef0fd); box-shadow:0 0 0 1.5px var(--brand, var(--accent-2)); }
        .sbar:focus-visible{ outline:2px solid var(--brand, var(--accent-2)); outline-offset:2px; }
        .tgroups{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; }
        .tgrp{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:4px 8px 4px 12px; border:1px solid var(--brand-line, var(--border)); border-radius:24px; background:#fff; }
        .tgrp.tmap{ background:var(--brand-soft, #eef0fd); border-color:var(--brand, var(--accent-2)); }
        .tgl{ font-size:9.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); }
        .tgrp.tmap .tgl{ color:var(--brand-ink, var(--text-primary)); }
        .tsep{ width:1px; height:22px; background:var(--brand-line, var(--border)); margin:0 2px; }
        /* el buscador: el mismo menú de filtros de las tablas (tipo de filtro con su icono, caja de búsqueda y la lista con «Todos») */
        .fmenu{ border:1px solid var(--brand-line, var(--border)); border-radius:16px; background:#fff; padding:10px 12px; display:grid; gap:8px; }
        .mcur{ font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
        .srow{ display:flex; align-items:center; gap:8px; position:relative; }
        .srow .sbox{ flex:1; min-width:0; }
        .fmode{ width:40px; height:40px; flex:none; display:grid; place-items:center; padding:0; border:1px solid var(--brand, var(--accent-2)); border-radius:12px; background:var(--brand-soft, #eef0fd); color:var(--brand-ink, var(--text-primary)); cursor:pointer; }
        .fmode svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .fmode:focus-visible, .mopt:focus-visible, .sumrow:focus-visible{ outline:2px solid var(--brand, var(--accent-2)); outline-offset:2px; }
        .fsign span{ font-size:13px; font-weight:800; letter-spacing:-.02em; }
        .mpop.sign{ left:48px; min-width:250px; }
        .mopt.sg{ display:flex; align-items:center; gap:12px; }
