<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"> <!-- sin zoom automático al tocar un campo: todos los textos miden igual -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Pedido Manual</title>
    <link rel="icon" href="/icons/icon-512.png">
    <style>
        :root{
            --bg:#f6eef8; --surface:#ffffff; --ink:#2a1b30; --muted:#7a6a80; --line:#e4d2e9; --accent:#7d3f8f; --soft:#f1e4f5; --ok:#2e8b57; --warn:#c0392b; --shadow:0 10px 26px rgba(60,20,70,.14);
        }
        @media (prefers-color-scheme: dark){
            :root{ --bg:#1d1422; --surface:#2a1d31; --ink:#f3e8f6; --muted:#b9a5c0; --line:#493556; --accent:#d3a2e6; --soft:#3a2745; --ok:#5cc58a; --warn:#ff8a7a; --shadow:0 10px 26px rgba(0,0,0,.5); }
        }
        *{ box-sizing:border-box; }
        html,body{ margin:0; min-height:100%; }
        body{ background:var(--bg); color:var(--ink); font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:14px 14px 36px; display:flex; justify-content:center; }
        main{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:12px; }
        .card{ background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:12px; }
        h1{ font-size:20px; margin:0; }
        h2{ font-size:15px; margin:0; }
        .chip{ display:inline-flex; align-items:center; gap:6px; width:max-content; max-width:100%; font-weight:600; font-size:14px; padding:4px 12px; border:1px solid var(--line); border-radius:999px; }
        label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
        input[type=text], input[type=search], input[type=number]{ width:100%; font:500 16px system-ui,sans-serif; padding:11px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); }
        input:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
        .btn{ font:600 16px system-ui,sans-serif; padding:14px 16px; border-radius:16px; border:0; background:var(--ink); color:var(--surface); cursor:pointer; width:100%; }
        .btn.alt{ background:transparent; color:var(--ink); border:1px solid var(--line); }
        .btn.ok{ background:var(--ok); color:#fff; }
        .btn[disabled]{ opacity:.55; cursor:default; }
        .link{ background:none; border:0; color:var(--accent); font:600 14px system-ui,sans-serif; padding:8px; cursor:pointer; text-align:center; }
        .list{ display:flex; flex-direction:column; gap:8px; }
        .res{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; border:1px solid var(--line); border-radius:14px; padding:8px 10px; background:var(--surface); text-align:left; width:100%; cursor:pointer; font:inherit; color:inherit; }
        .res b{ font-size:13px; font-variant-numeric:tabular-nums; display:block; }
        .res span{ display:block; font-size:15px; }
        .res small{ color:var(--muted); font-size:12px; }
        .plus{ width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:20px; font-weight:700; }
        .sel{ border:1px solid var(--accent); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .sel b{ font-size:16px; }
        .sel small{ color:var(--muted); font-size:12px; }
        .qty{ display:flex; align-items:center; justify-content:center; gap:12px; }
        .qty button{ width:46px; height:46px; border-radius:50%; border:1.5px solid var(--accent); background:transparent; color:var(--accent); font-size:24px; font-weight:700; cursor:pointer; }
        .qty input{ width:110px; text-align:center; font-size:26px; font-weight:700; padding:8px; }
        .qty span{ font-size:13px; color:var(--muted); min-width:34px; }
        .line{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; border-bottom:1px solid var(--line); padding:6px 0; }
        .line span{ font-size:14px; }
        .line small{ color:var(--muted); font-size:12px; display:block; }
        .line .q{ display:flex; align-items:center; gap:6px; }
        .line .q button{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer; }
        .line .q b{ min-width:44px; text-align:center; font-variant-numeric:tabular-nums; }
        .line .rm{ border:0; background:none; color:var(--warn); font-size:12px; cursor:pointer; padding:2px 6px; }
        .msg{ color:var(--muted); font-size:13px; border:1px dashed var(--line); border-radius:14px; padding:10px 12px; text-align:center; }
        .err{ color:var(--warn); font-size:14px; border:1px solid var(--warn); border-radius:14px; padding:10px 12px; }
        .muted{ color:var(--muted); font-size:13px; }
        .done{ text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center; }
        .done .folio{ font:700 32px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.04em; }
        .done .items{ width:100%; text-align:left; border-top:1px solid var(--line); margin-top:4px; padding-top:8px; }
        .done .items h2{ margin-bottom:2px; }
        .tick{ width:56px; height:56px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:30px; }
        .req{ color:var(--warn); }
        /* El buscador es el mismo de los demás QR (Layout): tipo de filtro, signos $ @ , la caja con su borrar y «Buscar en» con «Todos». */
        .fmenu{ display:grid; gap:8px; }
        .mcur{ font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
        .srow{ display:flex; align-items:center; gap:8px; position:relative; }
        .sbox{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:9px 12px; border:1.5px solid var(--accent); border-radius:14px; background:var(--surface); }
        .sbox:focus-within{ box-shadow:0 0 0 2px var(--line); }
        .sbox svg{ width:18px; height:18px; stroke:var(--accent); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
        .sbox input[type=search]{ flex:1; width:0; min-width:0; border:0; outline:0; padding:0; border-radius:0; background:transparent; font:500 16px system-ui,sans-serif; color:var(--ink); -webkit-appearance:none; appearance:none; }
        .sbox input::placeholder{ color:var(--muted); }
        .sbox input::-webkit-search-cancel-button, .sbox input::-webkit-search-decoration{ -webkit-appearance:none; display:none; }
        .sx{ width:24px; height:24px; flex:none; border:0; border-radius:50%; background:var(--soft); color:var(--accent); font-size:15px; line-height:1; cursor:pointer; padding:0; }
        .sx[hidden]{ display:none; }
        .fmode{ width:40px; height:40px; flex:none; display:grid; place-items:center; padding:0; border:1px solid var(--accent); border-radius:12px; background:var(--soft); color:var(--ink); cursor:pointer; }
        .fmode svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .fsign span{ font-size:13px; font-weight:800; letter-spacing:-.02em; }
        .mpop[hidden]{ display:none; }
        .mpop{ position:absolute; left:0; top:46px; z-index:5; min-width:160px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 26px rgba(20,22,31,.18); padding:5px; display:grid; gap:2px; }
        .mpop.sign{ left:48px; min-width:250px; }
        .mopt{ font:inherit; font-size:13.5px; text-align:left; padding:9px 12px; border:0; border-radius:8px; background:transparent; color:var(--ink); cursor:pointer; }
        .mopt[aria-pressed="true"]{ background:var(--soft); font-weight:700; }
        .mopt:disabled{ opacity:.4; cursor:default; }
        .mopt.sg{ display:flex; align-items:center; gap:12px; }
        .mopt.sg b{ width:22px; flex:none; text-align:center; font-size:17px; color:var(--accent); }
        .mopt.sg span{ display:grid; gap:1px; }
        .mopt.sg small{ font-size:11.5px; font-weight:400; color:var(--muted); }
        .sumrow{ font:inherit; display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:inherit; cursor:pointer; }
        .sumrow .lbl{ font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
        .sumrow b{ font-size:13px; font-weight:600; }
        .sumrow i{ margin-left:auto; width:8px; height:8px; border-right:1.6px solid var(--accent); border-bottom:1.6px solid var(--accent); transform:rotate(45deg) translateY(-2px); }
        .sumrow[aria-expanded="true"] i{ transform:rotate(-135deg) translateY(-2px); }
        .flist[hidden]{ display:none; }
        .flist{ display:grid; }
        .copt{ position:relative; display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:9px; font-size:14px; cursor:pointer; margin:0; color:var(--ink); }
        .copt input{ position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
        .copt .box{ width:18px; height:18px; border-radius:5px; border:1.6px solid var(--muted); display:grid; place-items:center; flex:none; }
        .copt input:checked + .box, .copt.mixed .box{ background:var(--accent); border-color:var(--accent); }
        .copt input:checked + .box::after{ content:""; width:8px; height:4px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translateY(-1px); }
        .copt.mixed input:not(:checked) + .box::after{ content:""; width:8px; height:2px; background:#fff; border-radius:2px; }
        .copt input:focus-visible + .box{ outline:2px solid var(--accent); outline-offset:2px; }
        .copt.all{ font-weight:700; border-bottom:1px solid var(--line); border-radius:9px 9px 0 0; margin-bottom:2px; }
        mark{ background:var(--soft); color:inherit; border-radius:3px; padding:0 1px; box-shadow:0 0 0 1px var(--line); }
        mark.aux{ background:transparent; }
        /* Para cuándo: lista en el celular y tabla por día en pantalla ancha (mismo pedido armado) */
        main.wide{ max-width:75rem; }
        /* Letras y controles en rem, tanto en la computadora (la ventana de QR's toma el tamaño de letra del sistema) como en el celular (sigue el tamaño de texto del aparato): todo se acomoda al tamaño y se ve igual en los dos. */
        main.compact{ font-size:.85rem; }
        main.compact h1{ font-size:1.2rem; }
        main.compact h2{ font-size:.95rem; }
        main.compact label{ font-size:.72rem; }
        main.compact .chip{ font-size:.8rem; padding:.15rem .7rem; }
        main.compact input[type=text], main.compact input[type=search], main.compact input[type=number]{ font-size:.85rem; padding:.55rem .8rem; border-radius:.8rem; }
        main.compact .btn{ font-size:.9rem; padding:.7rem 1rem; border-radius:.9rem; }
        main.compact .link{ font-size:.8rem; }
        main.compact .card{ padding:.9rem 1rem; border-radius:1.2rem; gap:.7rem; }
        main.compact .msg, main.compact .muted{ font-size:.78rem; }
        main.compact .res b{ font-size:.78rem; }
        main.compact .res span{ font-size:.85rem; }
        main.compact .res small{ font-size:.72rem; }
        main.compact .plus{ width:2rem; height:2rem; font-size:1.1rem; }
        main.compact .sbox{ padding:.5rem .7rem; }
        main.compact .sbox input[type=search]{ font-size:.85rem; }
        main.compact .sbox svg{ width:1rem; height:1rem; }
        main.compact .fmode{ width:2.3rem; height:2.3rem; border-radius:.7rem; }
        main.compact .fmode svg{ width:1rem; height:1rem; }
        main.compact .fsign span{ font-size:.8rem; }
        main.compact .mcur{ font-size:.62rem; }
        main.compact .sumrow{ padding:.5rem .65rem; }
        main.compact .sumrow b{ font-size:.8rem; }
        main.compact .sumrow .lbl{ font-size:.62rem; }
        main.compact .copt{ font-size:.82rem; }
        main.compact .mopt{ font-size:.8rem; }
        main.compact .sel b{ font-size:.95rem; }
        main.compact .qty input{ font-size:1.3rem; width:6rem; }
        main.compact .qty button{ width:2.4rem; height:2.4rem; font-size:1.2rem; }
        main.compact .line span, main.compact .oline .top span{ font-size:.85rem; }
        main.compact .line small, main.compact .oline .top small{ font-size:.72rem; }
        main.compact .oline .q button{ width:1.8rem; height:1.8rem; font-size:1rem; }
        main.compact .dchip, main.compact select.dsel, main.compact select.when, main.compact .split{ font-size:.78rem; }
        main.compact .seg button{ font-size:.72rem; }
        main.compact .done .folio{ font-size:1.8rem; }
        main.compact table.dias{ font-size:.8rem; }
        main.compact .dias td.art b{ font-size:.82rem; }
        main.compact .dias td.art small{ font-size:.68rem; }
        main.compact .dh span{ font-size:.6rem; }
        main.compact .dh b{ font-size:1rem; }
        main.compact .dh small{ font-size:.66rem; }
        main.compact .dh em{ font-size:.56rem; }
        main.compact .dh b.asap{ font-size:.75rem; }
        main.compact .qc{ font-size:.85rem; }
        main.compact .tot small, main.compact .pill{ font-size:.68rem; }
        main.compact .pill b{ font-size:.8rem; }
        .chips{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
        .dchip{ font:600 13px system-ui,sans-serif; border:1px solid var(--line); border-radius:999px; padding:6px 12px; background:var(--surface); color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; line-height:1.15; }
        .dchip small{ font-weight:400; font-size:11px; color:var(--muted); }
        .dchip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--surface); }
        .dchip[aria-pressed="true"] small{ color:var(--surface); opacity:.85; }
        select.dsel, select.when{ font:600 13px system-ui,sans-serif; border:1px solid var(--line); border-radius:12px; padding:6px 10px; background:var(--surface); color:var(--ink); max-width:100%; }
        select.dsel.on, select.when.diff{ border-color:var(--accent); background:var(--soft); }
        .oline{ display:flex; flex-direction:column; gap:6px; padding:10px 0; border-bottom:1px solid var(--line); }
        .oline .top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
        .oline .top span{ font-size:14px; }
        .oline .top small{ display:block; color:var(--muted); font-size:12px; }
        .oline .sub{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .oline .q{ display:flex; align-items:center; gap:6px; }
        .oline .q button{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer; }
        .oline .q b{ min-width:40px; text-align:center; font-variant-numeric:tabular-nums; }
        .oline .q .u{ font-size:12px; color:var(--muted); }
        .oline select.when{ margin-left:auto; }
        .oline .rm, .art .rm{ border:0; background:none; color:var(--warn); font-size:12px; cursor:pointer; padding:2px 6px; }
        .split{ font:600 13px system-ui,sans-serif; color:var(--accent); background:none; border:0; cursor:pointer; padding:0; text-align:left; width:max-content; }
        .pickwhen{ display:flex; align-items:center; gap:8px; justify-content:center; }
        .pickwhen label{ margin:0; }
        .ohd{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
        .seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
        .seg button{ font:600 12px system-ui,sans-serif; padding:5px 14px; border:0; background:transparent; color:var(--ink); cursor:pointer; }
        .seg button[aria-pressed="true"]{ background:var(--accent); color:var(--surface); }
        .scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:16px; }
        table.dias{ border-collapse:separate; border-spacing:0; width:100%; min-width:760px; font-size:13px; }
        .dias th, .dias td{ padding:6px 5px; border-bottom:1px solid var(--line); text-align:center; vertical-align:middle; background:var(--surface); }
        .dias tr:last-child td{ border-bottom:0; }
        .dias th.art, .dias td.art{ position:sticky; left:0; z-index:1; text-align:left; min-width:210px; max-width:230px; padding-left:12px; border-right:1px solid var(--line); }
        .dias td.art b{ display:block; font-size:13px; line-height:1.25; }
        .dias td.art small{ display:block; color:var(--muted); font-size:11px; }
        .dias .wk{ background:var(--bg); }
        .dias td.emptyrow{ text-align:center; color:var(--muted); font-size:13px; padding:16px 12px; }
        /* tabla: el buscador vive en la celda «Artículo» del encabezado; sus menús se abren hacia abajo dentro de la celda y los resultados salen en el primer renglón */
        .dias th.art{ min-width:330px; max-width:380px; vertical-align:top; padding:10px 12px; }
        .dias td.art{ min-width:330px; max-width:380px; }
        .dias .mpop{ position:static; box-shadow:none; margin-top:6px; }
        .dias .mpop.sign{ min-width:0; left:auto; }
        .dias td.resrow{ text-align:left; padding:8px 12px; }
        .dias .list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
        /* tabla uniforme: columnas de ancho fijo (el artículo, lo antes posible, cada día, otra fecha y el total) y encabezados alineados arriba */
        table.dias{ table-layout:fixed; min-width:0; }
        .dias thead th:not(.art){ vertical-align:top; padding-top:12px; }
        .dias th.dc .dh{ height:4.75rem; justify-content:flex-start; }
        .dias .dh b.asap{ font-size:12px; line-height:1.2; max-width:5.2rem; text-align:center; }
        .dias .qc{ width:100%; max-width:3.75rem; }
        .dias select.dsel{ width:100%; }
        .dias th.art, .dias td.art{ min-width:0; max-width:none; }
        .dias .arttitle{ font-size:.95rem; font-weight:700; margin-bottom:.35rem; color:var(--ink); }
        .dias th.art .fmenu{ gap:.4rem; }
        .dias th.art .sumrow{ padding:.35rem .6rem; }
        .dias th.art .mcur{ margin-bottom:-.1rem; }
        .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
        .dh{ display:flex; flex-direction:column; align-items:center; line-height:1.15; padding:2px 0; }
        .dh span{ font-size:10px; font-weight:800; letter-spacing:.08em; color:var(--muted); }
        .dh b{ font-size:16px; }
        .dh b.asap{ font-size:12px; max-width:80px; }
        .dh small{ font-size:11px; color:var(--muted); }
        .dh em{ font-style:normal; font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ok); border:1px solid var(--ok); border-radius:999px; padding:0 7px; margin-top:2px; }
        .qc{ width:60px; text-align:center; font:600 15px system-ui,sans-serif; padding:7px 2px; border:1px dashed var(--line); border-radius:10px; background:transparent; color:var(--ink); -moz-appearance:textfield; }
        .qc::-webkit-inner-spin-button, .qc::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
        .qc::placeholder{ color:var(--line); font-weight:400; }
        .qc.on{ border:1.5px solid var(--accent); background:var(--soft); }
        .tot{ font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
        .tot small{ display:block; font-weight:400; color:var(--muted); font-size:11px; }
        .sumbar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
        .pill{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:14px; padding:6px 12px; background:var(--bg); font-size:12px; min-width:110px; }
        .pill b{ font-size:13px; }
        .pill.empty{ opacity:.6; }
        @media (prefers-reduced-motion: no-preference){ .card{ animation:rise .25s ease-out; } @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } } }
    </style>
</head>

    <div id="qr-brand"></div>

</main>

    const colgroup = `<colgroup><col style="width:24rem"><col style="width:5.75rem">${cols.slice(1).map(() => '<col style="width:4.5rem">').join('')}<col style="width:7.75rem"><col style="width:5.25rem"></colgroup>`;
    const addCol = more.length ? `<select class="dsel" id="addcol" aria-label="${esc(TEXT.addColumn)}"><option value="">${esc(TEXT.addColumn)}</option>${more.map((d) => `<option value="${d}">${esc(dayShort(d))}</option>`).join('')}</select>` : '';
    const rows = !cart.length ? `<tr><td colspan="${cols.length + 3}" class="emptyrow">${esc(TEXT.emptyTable)}</td></tr>` : cart.map((c, i) => `<tr><td class="art"><b>${esc(c.description)}</b><small>${esc([c.code, c.uom].filter(Boolean).join(' · '))}</small><button type="button" class="rm" data-rm="${i}">${esc(TEXT.remove)}</button></td>${cols.map((w) => {
        const p = partOf(c, w);
        const weekend = w && dayParts(w).weekend;
        return `<td${weekend ? ' class="wk"' : ''}><input class="qc${p ? ' on' : ''}" type="number" min="0" step="any" inputmode="decimal" placeholder="–" data-cell="${i}|${w}" value="${esc(p ? p.quantity : '')}" aria-label="${esc(`${c.description}, ${whenLabel(w)}`)}"></td>`;
    }).join('')}<td class="tot" id="tot-${i}"></td></tr>`).join('');
    return `<div class="scroll" role="region" tabindex="0" aria-label="${esc(TEXT.yourOrder)}"><table class="dias" style="width:${tableW}rem">${colgroup}<thead><tr><th class="art"><div class="arttitle">${esc(TEXT.article)}</div>${panelHtml()}</th>${head}<th>${addCol}</th><th>${esc(TEXT.total)}</th></tr></thead><tbody><tr class="resrow"><td colspan="${cols.length + 3}"><div id="results"></div></td></tr>${rows}</tbody></table></div><div><div class="muted">${esc(TEXT.perDay)}</div><div class="sumbar" id="sumbar">${summaryHtml()}</div></div>`;
}
// Al escribir en una casilla solo se ponen al día los totales, el resumen por día y el título: así no se pierde el cursor.
function refreshTable() {
    cart.forEach((c, i) => { const el = $(`tot-${i}`); if (el) el.innerHTML = totalOf(c) > 0 ? `${esc(fmtQty(totalOf(c)))}<small>${esc(c.uom)}</small>` : '–'; });
    const bar = $('sumbar');
    if (bar) bar.innerHTML = summaryHtml();
    const head = $('ohead');
    if (head) head.innerHTML = headText();
}
// El pedido: SIEMPRE pide el nombre de quien pide (con sesión ya viene escrito el de la cuenta y se puede cambiar: quien manda no siempre es quien pide) y lo armado queda en un solo número de pedido con su lista de artículos.
function drawOrder() {
    const box = $('orderbox');
    if (!box) return;
    const body = wide ? drawOrderTable() : drawOrderList(); // con el pedido vacío también se ve la tabla (o las fechas de la lista), con su aviso
    const who = `<div><label for="name">${esc(TEXT.yourName)} <span class="req" aria-hidden="true">*</span></label><input type="text" id="name" maxlength="60" autocomplete="name" required placeholder="${esc(TEXT.namePlaceholder)}" value="${esc(nameValue)}"></div>`;
    const today = wide ? `<span class="muted">${esc(fill(TEXT.todayIs, { d: new Intl.DateTimeFormat(locale, { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' }).format(dayDate(todayIso())) }))}</span>` : '';
    box.innerHTML = `<div class="ohd"><h2 id="ohead">${headText()}</h2>${today}${layoutToggle()}</div>${who}${body}${cart.length ? `<button type="button" class="btn ok" id="send">${esc(TEXT.send)}</button><div class="muted" style="text-align:center">${esc(TEXT.stamp)}</div><div class="err" id="err" role="alert" hidden></div>` : ''}`;
    if (wide) { refreshTable(); drawResults(); } // el buscador de la tabla se vuelve a dibujar con la tabla
}
// Tabla: al elegir un artículo del buscador se agrega su renglón (sin cantidad) y el cursor queda en la casilla del día de partida.
function addRow(r) {
    let idx = cart.findIndex((c) => c.id === r.id);
    if (idx < 0) { cart.push({ id: r.id, code: r.code, description: r.description, uom: r.uom, parts: [] }); idx = cart.length - 1; }
    drawOrder();
    const cell = document.querySelector(`[data-cell="${idx}|${defaultWhen}"]`);
    if (cell) { cell.focus(); cell.select(); }
}
function addPicked() {
    const n = Number(String(picked.qty).replace(',', '.'));
    if (!Number.isFinite(n) || n <= 0) { $('qty').focus(); return; }
    const q = Math.round(n * 1000) / 1000;
    const when = picked.when || '';
    const found = cart.find((c) => c.id === picked.id);
    if (found) { const p = partOf(found, when); if (p) p.quantity = Math.round((p.quantity + q) * 1000) / 1000; else found.parts.push({ when, quantity: q }); }
    else cart.push({ id: picked.id, code: picked.code, description: picked.description, uom: picked.uom, parts: [{ when, quantity: q }] });
    picked = null;
    drawSel(); drawOrder();
}
async function search() {
    const my = ++seq;
    if (!ready()) { results = []; total = 0; drawResults(); return; }
    try {
        const res = await fetch(`${API}/search?q=${encodeURIComponent(searchTerms(query))}&mode=${mode}&fields=${fields.join(',')}`, { cache: 'no-store' });
        if (my !== seq) return;
        if (!res.ok) { results = []; total = 0; drawResults(); return; }
        const body = await res.json();
        results = body.items || [];
        total = body.total || 0;
    } catch (e) { results = []; total = 0; }
    if (my === seq) drawResults();
}
function queueSearch() {
    const clear = $('qclear');
    if (clear) clear.hidden = !query;
    clearTimeout(timer);
    timer = setTimeout(search, 250);
}
// Escribe el signo donde está el cursor de la caja (la coma lleva su espacio) y deja el cursor justo después, con el teclado abierto.
function insertSign(sign) {
    const input = $('q');
    const start = input.selectionStart == null ? input.value.length : input.selectionStart;
    const end = input.selectionEnd == null ? start : input.selectionEnd;
    const text = sign === ',' ? ', ' : sign;
    input.value = input.value.slice(0, start) + text + input.value.slice(end);
    input.focus();
    try { input.setSelectionRange(start + text.length, start + text.length); } catch (e) { /* algunos teclados no dejan mover el cursor */ }
    query = input.value;
    queueSearch();
}
function drawMode() {
    $('mode-cur').textContent = TEXT.searchModes[mode];
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === mode)));
    document.querySelectorAll('[data-sign]').forEach((b) => { const off = signOff(b.getAttribute('data-sign')); b.disabled = off; if (off) b.title = TEXT.searchSignOff; else b.removeAttribute('title'); });
    $('modepop').hidden = true; $('signpop').hidden = true;
}
function setField(key, checked) {
    if (key === 'all') fields = [];
    else {
        const set = new Set(fields);
        if (checked) set.add(key); else set.delete(key);
        fields = FIELD_KEYS.filter((k) => set.has(k));
        if (fields.length === FIELD_KEYS.length) fields = [];
    }
    $('fields').innerHTML = fieldsListHtml();
    $('fields-sum').textContent = fieldsSummary();
    search();
}

// Un solo oyente para todo lo que se toca en la página.
$('view').addEventListener('click', (event) => {
    const t = event.target;
    const modePop = $('modepop');
    const signPop = $('signpop');
    if (modePop && !modePop.hidden && !t.closest('#modebtn') && !t.closest('#modepop')) modePop.hidden = true;
    if (signPop && !signPop.hidden && !t.closest('#signbtn') && !t.closest('#signpop')) signPop.hidden = true;
    if (t.closest('#modebtn')) { modePop.hidden = !modePop.hidden; signPop.hidden = true; return; }
    if (t.closest('#signbtn')) { signPop.hidden = !signPop.hidden; modePop.hidden = true; return; }
    const sign = t.closest('[data-sign]');
    if (sign) { if (!sign.disabled) insertSign(sign.getAttribute('data-sign')); signPop.hidden = true; return; }
    const modeBtn = t.closest('[data-mode]');
    if (modeBtn) { mode = modeBtn.getAttribute('data-mode'); drawMode(); search(); return; }
    const toggle = t.closest('#fieldstoggle');
    if (toggle) { const list = $('fields'); list.hidden = !list.hidden; toggle.setAttribute('aria-expanded', String(!list.hidden)); return; }
    if (t.closest('#qclear')) { const q = $('q'); q.value = ''; query = ''; queueSearch(); q.focus(); return; }
    const pick = t.closest('[data-pick]');
    if (pick && wide) { addRow(results[Number(pick.getAttribute('data-pick'))]); return; }
    if (pick) { picked = { ...results[Number(pick.getAttribute('data-pick'))], qty: 1, when: defaultWhen }; drawSel(); const qi = $('qty'); if (qi) { qi.focus(); qi.select(); } return; }
    if (t.closest('#dec')) { picked.qty = Math.max(1, Math.round((Number(picked.qty) || 1) - 1)); $('qty').value = picked.qty; return; }
    if (t.closest('#inc')) { picked.qty = Math.round((Number(picked.qty) || 0) + 1); $('qty').value = picked.qty; return; }
    if (t.closest('#add')) { addPicked(); return; }
    if (t.closest('#cancel')) { picked = null; drawSel(); return; }
    // una cantidad con su fecha (lista del celular): data-attr="artículo:renglón"
    const part = (attr) => { const el = t.closest(`[${attr}]`); if (!el) return null; const [i, j] = el.getAttribute(attr).split(':').map(Number); const c = cart[i]; return c && c.parts[j] ? { c, p: c.parts[j], j } : null; };
    const pdec = part('data-pdec');
    if (pdec) { pdec.p.quantity = Math.max(1, Math.round(pdec.p.quantity - 1)); drawOrder(); return; }
    const pinc = part('data-pinc');
    if (pinc) { pinc.p.quantity = Math.round(pinc.p.quantity + 1); drawOrder(); return; }
    const prm = part('data-prm');
    if (prm) { prm.c.parts.splice(prm.j, 1); drawOrder(); return; }
    const addpart = t.closest('[data-addpart]');
    if (addpart) {
        const c = cart[Number(addpart.getAttribute('data-addpart'))];
        // la fecha de la nueva cantidad: el primer día que ese artículo todavía no tiene
        const free = ['', ...allDays()].find((w) => !partOf(c, w));
        if (c && free !== undefined) { c.parts.push({ when: free, quantity: 1 }); drawOrder(); }
        return;
    }
    const lay = t.closest('[data-layout]');
    if (lay) { layoutPref = lay.getAttribute('data-layout'); store.set(KEY_LAYOUT, layoutPref); applyWide(); view(); return; }
    const defwhen = t.closest('[data-defwhen]');
    if (defwhen) { setDefault(defwhen.getAttribute('data-defwhen')); return; }
    const rm = t.closest('[data-rm]');
    if (rm) { cart.splice(Number(rm.getAttribute('data-rm')), 1); drawOrder(); return; }
    if (t.closest('#send')) sendOrder();
});
$('view').addEventListener('input', (event) => {
    const t = event.target;
    if (t.id === 'q') { query = t.value; queueSearch(); }
    else if (t.id === 'qty' && picked) picked.qty = t.value;
    else if (t.id === 'name') nameValue = t.value;
    else if (t.dataset && t.dataset.cell !== undefined) {
        // una casilla de la tabla por día: artículo|fecha
        const [i, w] = t.dataset.cell.split('|');
        const c = cart[Number(i)];
        if (!c) return;
        const n = Number(String(t.value).replace(',', '.'));
        const q = Number.isFinite(n) && n > 0 ? Math.round(n * 1000) / 1000 : 0;
        setQty(c, w, q);
        t.classList.toggle('on', q > 0);
        refreshTable();
    }
});
$('view').addEventListener('change', (event) => {
    const t = event.target;
    const box = t.closest('[data-field]');
    if (box) { setField(box.getAttribute('data-field'), box.checked); return; }
    if (t.id === 'pickwhen' && picked) { picked.when = t.value; return; }
    if (t.id === 'defother') { setDefault(t.value); return; }
    if (t.id === 'addcol') { if (t.value) { extraCols.push(t.value); drawOrder(); } return; }
    const pw = t.getAttribute && t.getAttribute('data-part');
    if (pw) {
        // otra fecha para esa cantidad; si el artículo ya tiene cantidad en esa fecha, se juntan
        const [i, j] = pw.split(':').map(Number);
        const c = cart[i];
        const p = c && c.parts[j];
        if (!p) return;
        const same = c.parts.find((x, k) => k !== j && x.when === t.value);
        if (same) { same.quantity = Math.round((same.quantity + p.quantity) * 1000) / 1000; c.parts.splice(j, 1); } else p.when = t.value;
        drawOrder();
    }
});

async function sendOrder() {
    const err = $('err');
    const fail = (text) => { err.textContent = text; err.hidden = false; };
    err.hidden = true;
    const name = nameValue.replace(/\s+/g, ' ').trim();
    if (!name) { fail(TEXT.needName); $('name').focus(); return; }
    if (!flatLines().length) { fail(TEXT.errItems); return; }
    const btn = $('send');
    btn.disabled = true;
    btn.textContent = TEXT.sending;
    const items = flatLines();
    try {
        const res = await fetch(`${API}/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, items: items.map((c) => ({ id: c.id, quantity: c.quantity, needBy: c.needBy })) }) });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
            btn.disabled = false; btn.textContent = TEXT.send;
            if (body.code === 'LOCKED') { info.locks.register = false; view(); return; }
            if (body.code === 'LOGIN') { info.locks.signin = true; info.signedIn = false; view(); return; }
            fail(body.code === 'NAME' ? TEXT.needName : (body.code === 'QTY' ? TEXT.errQty : (body.code === 'ITEMS' ? TEXT.errItems : (body.code === 'TOOMANY' ? TEXT.tooMany : (body.code === 'RELATED' ? TEXT.errRelated : (body.code === 'DATE' ? TEXT.errDate : TEXT.errGeneric))))));
            return;
        }
        store.set(KEY_NAME, name);
        sentInfo = { folio: body.folio, name: body.name, createdAt: body.createdAt, items };
        cart = [];
        view();
    } catch (e) {
        btn.disabled = false; btn.textContent = TEXT.send;
        fail(TEXT.errGeneric);
    }
}
// Lo enviado: el número de pedido y su lista de artículos.
function viewSent() {
    const when = new Date(sentInfo.createdAt).toLocaleString(LANG === 'en' ? 'en-US' : 'es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const lines = sentInfo.items.map((c) => `<div class="line"><span>${esc(c.description)}<small>${esc([c.code, c.uom, `${TEXT.needBy}: ${whenLabel(c.needBy)}`].filter(Boolean).join(' · '))}</small></span><div class="q"><b>${esc(fmtQty(c.quantity))}</b></div></div>`).join('');
    $('view').innerHTML = `<div class="card done"><div class="tick" aria-hidden="true">✓</div><h1>${esc(TEXT.sentTitle)}</h1><div class="muted">${esc(TEXT.folio)}</div><div class="folio">${esc(sentInfo.folio)}</div>
        <div>${esc(TEXT.by)}: <b>${esc(sentInfo.name)}</b></div><div>${esc(TEXT.at)}: <b>${esc(when)}</b></div>
        <div class="items"><h2>${esc(TEXT.list)} · ${esc(sentInfo.items.length === 1 ? TEXT.item1 : TEXT.items.replace('{n}', sentInfo.items.length))}</h2>${lines}</div>
        <button type="button" class="btn" id="again">${esc(TEXT.newOrder)}</button></div>`;
    $('again').addEventListener('click', () => { sentInfo = null; query = ''; results = []; total = 0; picked = null; view(); });
}

(async function init() {
    $('view').innerHTML = `<div class="card"><div class="muted">${esc(TEXT.loading)}</div></div>`;
    try {
        const res = await fetch(API, { cache: 'no-store' });
        if (!res.ok) throw new Error('not found');
        info = await res.json();
    } catch (err) { $('view').innerHTML = `<div class="card"><div class="err" role="alert">${esc(TEXT.notFound)}</div></div>`; return; }
    // el mismo encabezado del Layout: logo (o iniciales), tipo de página, Sitio y empresa
    window.QrBrandHeader.mount($('qr-brand'), { kind: TEXT.title, siteName: info.siteName, companyName: info.companyName, hasLogo: info.hasLogo, companyColor: info.companyColor, logoUrl: `/api/public/layout/${encodeURIComponent(TOKEN)}/logo` });
    if (!nameValue && info.signedIn) nameValue = info.userName || '';
    // pantalla ancha (la computadora, la ventana de QR's): la tabla por día; angosta (el celular): la lista. Al cambiar el ancho se vuelve a dibujar el mismo pedido.
    mq = window.matchMedia('(min-width: 780px)');
    applyWide();
    mq.addEventListener('change', () => { if (!layoutPref) { applyWide(); view(); } });
    view();
})();
})();
</script>
</body>
