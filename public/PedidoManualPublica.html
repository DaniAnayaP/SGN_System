<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"> <!-- sin zoom automático al tocar un campo: todos los textos miden igual -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Pedido Manual</title>
    <link rel="icon" href="/icons/icon-512.png">
    <style>
        :root{
            --bg:#f6eef8; --surface:#ffffff; --ink:#2a1b30; --muted:#7a6a80; --line:#e4d2e9; --accent:#7d3f8f; --soft:#f1e4f5; --ok:#2e8b57; --warn:#c0392b; --shadow:0 10px 26px rgba(60,20,70,.14); --xl:#1f7a4d; --xlsoft:#e3f3ea; --pdf:#b3402f; --pdfsoft:#fbe6e1;
        }
        @media (prefers-color-scheme: dark){
            :root{ --bg:#1d1422; --surface:#2a1d31; --ink:#f3e8f6; --muted:#b9a5c0; --line:#493556; --accent:#d3a2e6; --soft:#3a2745; --ok:#5cc58a; --warn:#ff8a7a; --shadow:0 10px 26px rgba(0,0,0,.5); --xl:#6fd0a0; --xlsoft:#1f3a2e; --pdf:#ff9f8f; --pdfsoft:#432723; }
        }
        *{ box-sizing:border-box; }
        html,body{ margin:0; min-height:100%; }
        body{ background:var(--bg); color:var(--ink); font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:14px 14px 36px; display:flex; justify-content:center; }
        main{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:12px; }
        .card{ background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:12px; }
        h1{ font-size:20px; margin:0; }
        h2{ font-size:15px; margin:0; }
        .chip{ display:inline-flex; align-items:center; gap:6px; width:max-content; max-width:100%; font-weight:600; font-size:14px; padding:4px 12px; border:1px solid var(--line); border-radius:999px; }
        label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
        input[type=text], input[type=search], input[type=number]{ width:100%; font:500 16px system-ui,sans-serif; padding:11px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); }
        input:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
        .btn{ font:600 16px system-ui,sans-serif; padding:14px 16px; border-radius:16px; border:0; background:var(--ink); color:var(--surface); cursor:pointer; width:100%; }
        .btn.alt{ background:transparent; color:var(--ink); border:1px solid var(--line); }
        .btn.ok{ background:var(--ok); color:#fff; }
        .btn[disabled]{ opacity:.55; cursor:default; }
        .link{ background:none; border:0; color:var(--accent); font:600 14px system-ui,sans-serif; padding:8px; cursor:pointer; text-align:center; }
        .list{ display:flex; flex-direction:column; gap:8px; }
        .res{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; border:1px solid var(--line); border-radius:14px; padding:8px 10px; background:var(--surface); text-align:left; width:100%; cursor:pointer; font:inherit; color:inherit; }
        .res b{ font-size:13px; font-variant-numeric:tabular-nums; display:block; }
        .res span{ display:block; font-size:15px; }
        .res small{ color:var(--muted); font-size:12px; }
        .plus{ width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:20px; font-weight:700; }
        .sel{ border:1px solid var(--accent); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .sel b{ font-size:16px; }
        .sel small{ color:var(--muted); font-size:12px; }
        .qty{ display:flex; align-items:center; justify-content:center; gap:12px; }
        .qty button{ width:46px; height:46px; border-radius:50%; border:1.5px solid var(--accent); background:transparent; color:var(--accent); font-size:24px; font-weight:700; cursor:pointer; }
        .qty input{ width:110px; text-align:center; font-size:26px; font-weight:700; padding:8px; }
        .qty span{ font-size:13px; color:var(--muted); min-width:34px; }
        .line{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; border-bottom:1px solid var(--line); padding:6px 0; }
        .line span{ font-size:14px; }
        .line small{ color:var(--muted); font-size:12px; display:block; }
        .line .q{ display:flex; align-items:center; gap:6px; }
        .line .q button{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer; }
        .line .q b{ min-width:44px; text-align:center; font-variant-numeric:tabular-nums; }
        .line .rm{ border:0; background:none; color:var(--warn); font-size:12px; cursor:pointer; padding:2px 6px; }
        .msg{ color:var(--muted); font-size:13px; border:1px dashed var(--line); border-radius:14px; padding:10px 12px; text-align:center; }
        .err{ color:var(--warn); font-size:14px; border:1px solid var(--warn); border-radius:14px; padding:10px 12px; }
        .muted{ color:var(--muted); font-size:13px; }
        .done{ text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center; }
        .done .folio{ font:700 32px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.04em; }
        .done .items{ width:100%; text-align:left; border-top:1px solid var(--line); margin-top:4px; padding-top:8px; }
        .done .items h2{ margin-bottom:2px; }
        .tick{ width:56px; height:56px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:30px; }
        .req{ color:var(--warn); }
        /* El buscador es el mismo de los demás QR (Layout): tipo de filtro, signos $ @ , la caja con su borrar y «Buscar en» con «Todos». */
        .fmenu{ display:grid; gap:8px; }
        .mcur{ font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
        .srow{ display:flex; align-items:center; gap:8px; position:relative; }
        .sbox{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:9px 12px; border:1.5px solid var(--accent); border-radius:14px; background:var(--surface); }
        .sbox:focus-within{ box-shadow:0 0 0 2px var(--line); }
        .sbox svg{ width:18px; height:18px; stroke:var(--accent); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
        .sbox input[type=search]{ flex:1; width:0; min-width:0; border:0; outline:0; padding:0; border-radius:0; background:transparent; font:500 16px system-ui,sans-serif; color:var(--ink); -webkit-appearance:none; appearance:none; }
        .sbox input::placeholder{ color:var(--muted); }
        .sbox input::-webkit-search-cancel-button, .sbox input::-webkit-search-decoration{ -webkit-appearance:none; display:none; }
        .sx{ width:24px; height:24px; flex:none; border:0; border-radius:50%; background:var(--soft); color:var(--accent); font-size:15px; line-height:1; cursor:pointer; padding:0; }
        .sx[hidden]{ display:none; }
        .fmode{ width:40px; height:40px; flex:none; display:grid; place-items:center; padding:0; border:1px solid var(--accent); border-radius:12px; background:var(--soft); color:var(--ink); cursor:pointer; }
        .fmode svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .fsign span{ font-size:13px; font-weight:800; letter-spacing:-.02em; }
        .mpop[hidden]{ display:none; }
        .mpop{ position:absolute; left:0; top:46px; z-index:5; min-width:160px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 26px rgba(20,22,31,.18); padding:5px; display:grid; gap:2px; }
        .mpop.sign{ left:48px; min-width:250px; }
        .mopt{ font:inherit; font-size:13.5px; text-align:left; padding:9px 12px; border:0; border-radius:8px; background:transparent; color:var(--ink); cursor:pointer; }
        .mopt[aria-pressed="true"]{ background:var(--soft); font-weight:700; }
        .mopt:disabled{ opacity:.4; cursor:default; }
        .mopt.sg{ display:flex; align-items:center; gap:12px; }
        .mopt.sg b{ width:22px; flex:none; text-align:center; font-size:17px; color:var(--accent); }
        .mopt.sg span{ display:grid; gap:1px; }
        .mopt.sg small{ font-size:11.5px; font-weight:400; color:var(--muted); }
        .sumrow{ font:inherit; display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:inherit; cursor:pointer; }
        .sumrow .lbl{ font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
        .sumrow b{ font-size:13px; font-weight:600; }
        .sumrow i{ margin-left:auto; width:8px; height:8px; border-right:1.6px solid var(--accent); border-bottom:1.6px solid var(--accent); transform:rotate(45deg) translateY(-2px); }
        .sumrow[aria-expanded="true"] i{ transform:rotate(-135deg) translateY(-2px); }
        .flist[hidden]{ display:none; }
        .flist{ display:grid; }
        .copt{ position:relative; display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:9px; font-size:14px; cursor:pointer; margin:0; color:var(--ink); }
        .copt input{ position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
        .copt .box{ width:18px; height:18px; border-radius:5px; border:1.6px solid var(--muted); display:grid; place-items:center; flex:none; }
        .copt input:checked + .box, .copt.mixed .box{ background:var(--accent); border-color:var(--accent); }
        .copt input:checked + .box::after{ content:""; width:8px; height:4px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translateY(-1px); }
        .copt.mixed input:not(:checked) + .box::after{ content:""; width:8px; height:2px; background:#fff; border-radius:2px; }
        .copt input:focus-visible + .box{ outline:2px solid var(--accent); outline-offset:2px; }
        .copt.all{ font-weight:700; border-bottom:1px solid var(--line); border-radius:9px 9px 0 0; margin-bottom:2px; }
        mark{ background:var(--soft); color:inherit; border-radius:3px; padding:0 1px; box-shadow:0 0 0 1px var(--line); }
        mark.aux{ background:transparent; }
        /* Para cuándo: lista en el celular y tabla por día en pantalla ancha (mismo pedido armado) */
        main.wide{ max-width:75rem; }
        /* Letras y controles en rem, tanto en la computadora (la ventana de QR's toma el tamaño de letra del sistema) como en el celular (sigue el tamaño de texto del aparato): todo se acomoda al tamaño y se ve igual en los dos. */
        main.compact{ font-size:.85rem; }
        main.compact h1{ font-size:1.2rem; }
        main.compact h2{ font-size:.95rem; }
        main.compact label{ font-size:.72rem; }
        main.compact .chip{ font-size:.8rem; padding:.15rem .7rem; }
        main.compact input[type=text], main.compact input[type=search], main.compact input[type=number]{ font-size:.85rem; padding:.55rem .8rem; border-radius:.8rem; }
        main.compact .btn{ font-size:.9rem; padding:.7rem 1rem; border-radius:.9rem; }
        main.compact .link{ font-size:.8rem; }
        main.compact .card{ padding:.9rem 1rem; border-radius:1.2rem; gap:.7rem; }
        main.compact .msg, main.compact .muted{ font-size:.78rem; }
        main.compact .res b{ font-size:.78rem; }
        main.compact .res span{ font-size:.85rem; }
        main.compact .res small{ font-size:.72rem; }
        main.compact .plus{ width:2rem; height:2rem; font-size:1.1rem; }
        main.compact .sbox{ padding:.5rem .7rem; }
        main.compact .sbox input[type=search]{ font-size:.85rem; }
        main.compact .sbox svg{ width:1rem; height:1rem; }
        main.compact .fmode{ width:2.3rem; height:2.3rem; border-radius:.7rem; }
        main.compact .fmode svg{ width:1rem; height:1rem; }
        main.compact .fsign span{ font-size:.8rem; }
        main.compact .mcur{ font-size:.62rem; }
        main.compact .sumrow{ padding:.5rem .65rem; }
        main.compact .sumrow b{ font-size:.8rem; }
        main.compact .sumrow .lbl{ font-size:.62rem; }
        main.compact .copt{ font-size:.82rem; }
        main.compact .mopt{ font-size:.8rem; }
        main.compact .sel b{ font-size:.95rem; }
        main.compact .qty input{ font-size:1.3rem; width:6rem; }
        main.compact .qty button{ width:2.4rem; height:2.4rem; font-size:1.2rem; }
        main.compact .line span, main.compact .oline .top span{ font-size:.85rem; }
        main.compact .line small, main.compact .oline .top small{ font-size:.72rem; }
        main.compact .oline .q button{ width:1.8rem; height:1.8rem; font-size:1rem; }
        main.compact .dchip, main.compact select.dsel, main.compact select.when, main.compact .split{ font-size:.78rem; }
        main.compact .seg button{ font-size:.72rem; }
        main.compact .done .folio{ font-size:1.8rem; }
        main.compact table.dias{ font-size:.8rem; }
        main.compact .dias td.art b{ font-size:.82rem; }
        main.compact .dias td.art small{ font-size:.68rem; }
        main.compact .dh span{ font-size:.6rem; }
        main.compact .dh b{ font-size:1rem; }
        main.compact .dh small{ font-size:.66rem; }
        main.compact .dh em{ font-size:.56rem; }
        main.compact .dh b.asap{ font-size:.75rem; }
        main.compact .qc{ font-size:.85rem; }
        main.compact .tot small, main.compact .pill{ font-size:.68rem; }
        main.compact .pill b{ font-size:.8rem; }
        .chips{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
        .dchip{ font:600 13px system-ui,sans-serif; border:1px solid var(--line); border-radius:999px; padding:6px 12px; background:var(--surface); color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; line-height:1.15; }
        .dchip small{ font-weight:400; font-size:11px; color:var(--muted); }
        .dchip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--surface); }
        .dchip[aria-pressed="true"] small{ color:var(--surface); opacity:.85; }
        .sendbox{ display:flex; flex-direction:column; justify-content:flex-end; }
        .sendbox[hidden]{ display:none; }
        .whospacer{ display:none; }
        /* lista (celular): la tarjeta «Buscar artículo» NO aparece hasta que estén quién pide y el lugar; tabla (computadora): se ve apagada y no responde */
        .card[hidden]{ display:none; }
        /* lista (celular): con quién pide y el lugar ya puestos, la tarjeta de arriba se reduce a un renglón con «Cambiar» */
        .card.mini{ padding:.7rem 1rem; }
        .whosum{ display:flex; align-items:center; justify-content:space-between; gap:.7rem; }
        .whosum > div{ min-width:0; display:flex; flex-direction:column; gap:.1rem; }
        .whol{ font-size:.66rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
        .whosum b{ font-size:.95rem; line-height:1.3; overflow-wrap:anywhere; }
        .whosum .link{ flex:none; }
        .whofoot{ display:flex; justify-content:flex-end; margin-top:-.2rem; }
        .scroll.locked{ opacity:.6; pointer-events:none; }
        .whorow{ display:grid; grid-template-columns:1fr; gap:12px; }
        /* en pantalla ancha: «Quién pide», «Lugar que solicita» y «Enviar pedido» en un solo renglón; en la angosta (aunque se elija la tabla), uno debajo del otro */
        @media (min-width: 780px){
            main.wide .whorow{ grid-template-columns:minmax(0, 1fr) minmax(0, 1fr) auto; align-items:end; }
            main.wide .whospacer{ display:block; }
            main.wide .sendbox .btn{ width:auto; padding-inline:2.2rem; white-space:nowrap; }
        }
        select.place{ width:100%; font:500 16px system-ui,sans-serif; padding:11px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); }
        main.compact select.place{ font-size:.85rem; padding:.55rem .8rem; border-radius:.8rem; }
        select.dsel, select.when{ font:600 13px system-ui,sans-serif; border:1px solid var(--line); border-radius:12px; padding:6px 10px; background:var(--surface); color:var(--ink); max-width:100%; }
        select.dsel.on, select.when.diff{ border-color:var(--accent); background:var(--soft); }
        .oline{ display:flex; flex-direction:column; gap:6px; padding:10px 0; border-bottom:1px solid var(--line); }
        .oline .top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
        .oline .top span{ font-size:14px; }
        .oline .top small{ display:block; color:var(--muted); font-size:12px; }
        .oline .sub{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .oline .q{ display:flex; align-items:center; gap:6px; }
        .oline .q button{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer; }
        .oline .q b{ min-width:40px; text-align:center; font-variant-numeric:tabular-nums; }
        .oline .q .u{ font-size:12px; color:var(--muted); }
        .oline select.when{ margin-left:auto; }
        .art .rm[hidden]{ display:none; }
        .oline .rm, .art .rm{ border:0; background:none; color:var(--warn); font-size:12px; cursor:pointer; padding:2px 6px; }
        .split{ font:600 13px system-ui,sans-serif; color:var(--accent); background:none; border:0; cursor:pointer; padding:0; text-align:left; width:max-content; }
        .pickwhen{ display:flex; align-items:center; gap:8px; justify-content:center; }
        .pickwhen label{ margin:0; }
        .ohd{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
        .seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
        .seg button{ font:600 12px system-ui,sans-serif; padding:5px 14px; border:0; background:transparent; color:var(--ink); cursor:pointer; }
        .seg button[aria-pressed="true"]{ background:var(--accent); color:var(--surface); }
        .scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:16px; }
        table.dias{ border-collapse:separate; border-spacing:0; width:100%; min-width:760px; font-size:13px; }
        .dias th, .dias td{ padding:6px 5px; border-bottom:1px solid var(--line); text-align:center; vertical-align:middle; background:var(--surface); }
        .dias tr:last-child td{ border-bottom:0; }
        .dias th.art, .dias td.art{ position:sticky; left:0; z-index:1; text-align:left; min-width:210px; max-width:230px; padding-left:12px; border-right:1px solid var(--line); }
        .dias td.art b{ display:block; font-size:13px; line-height:1.25; }
        .dias td.art small{ display:block; color:var(--muted); font-size:11px; }
        .dias .wk{ background:var(--bg); }
        .dias td.emptyrow{ text-align:center; color:var(--muted); font-size:13px; padding:16px 12px; }
        /* tabla: el buscador vive en la celda «Artículo» del encabezado; sus menús se abren hacia abajo dentro de la celda y los resultados salen en el primer renglón */
        .dias th.art{ min-width:330px; max-width:380px; vertical-align:top; padding:10px 12px; }
        .dias td.art{ min-width:330px; max-width:380px; }
        .dias .mpop{ position:static; box-shadow:none; margin-top:6px; }
        .dias .mpop.sign{ min-width:0; left:auto; }
        .dias td.resrow{ text-align:left; padding:8px 12px; }
        .dias .list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
        /* tabla uniforme: columnas de ancho fijo (el artículo, lo antes posible, cada día, otra fecha y el total) y encabezados alineados arriba */
        table.dias{ table-layout:fixed; min-width:0; }
        .dias thead th:not(.art){ vertical-align:top; padding-top:12px; }
        .dias th.dc .dh{ height:4.75rem; justify-content:flex-start; }
        .dias .dh b.asap{ font-size:12px; line-height:1.2; max-width:5.2rem; text-align:center; }
        .dias .qc{ width:100%; max-width:3.75rem; }
        .dias select.dsel{ width:100%; }
        .dias th.art, .dias td.art{ min-width:0; max-width:none; }
        .dias .arttitle{ font-size:.95rem; font-weight:700; margin-bottom:.35rem; color:var(--ink); }
        .dias th.art .fmenu{ gap:.4rem; }
        .dias th.art .sumrow{ padding:.35rem .6rem; }
        .dias th.art .mcur{ margin-bottom:-.1rem; }
        /* tabla como la maqueta: encabezado limpio con su embudo, renglones altos, casillas grandes y columnas de fin de semana sombreadas */
        table.dias{ table-layout:fixed; min-width:0; }
        main.compact .dias th, main.compact .dias td{ padding:.5rem .3rem; }
        main.compact .dias thead th{ position:relative; vertical-align:middle; }
        main.compact .dias th.art, main.compact .dias td.art{ min-width:0; max-width:none; padding-left:.9rem; text-align:left; vertical-align:middle; }
        main.compact .dias .arthd{ display:flex; align-items:center; justify-content:flex-start; gap:.35rem; margin:0; }
        main.compact .dias .arttitle{ font-size:.95rem; font-weight:600; margin:0; }
        main.compact .dias th.totalh{ padding-right:.6rem; }
        main.compact .dias th.dc .dh{ height:auto; min-height:3.9rem; justify-content:center; }
        main.compact .dias th.dc .dh span{ font-size:.62rem; }
        main.compact .dias th.dc .dh b{ font-size:1.2rem; }
        main.compact .dias th.dc .dh small{ font-size:.68rem; }
        main.compact .dias th.dc .dh em{ font-size:.55rem; }
        main.compact .dias th.dc .dh b.asap{ font-size:.72rem; line-height:1.15; font-weight:700; max-width:none; }
        main.compact .dias .qc{ width:4rem; max-width:none; height:2.5rem; padding:0; font-size:.95rem; border-radius:.8rem; }
        main.compact .dias td.art b{ font-size:.85rem; }
        main.compact .dias td.art small{ font-size:.7rem; }
        main.compact .dias .tot{ font-size:.95rem; }
        main.compact .dias .tot small{ font-size:.66rem; }

// Lo escrito se lee con el mismo motor que las tablas y el servidor (SearchSyntax.js): varias búsquedas separadas por coma (sirve CUALQUIERA); $ = otra palabra ANTES y @ = otra palabra DESPUÉS. Hasta 80 letras y 6 búsquedas.
const searchTerms = (raw) => String(raw == null ? '' : raw).slice(0, 80).split(',').slice(0, 6).join(',');
const ready = () => window.SearchSyntax.ready(mode, searchTerms(query));
const SIGN_KEYS = { '$': 'before', '@': 'after', ',': 'comma' };
const signOff = (sign) => (sign === '$' && mode !== 'contains') || (sign === '@' && mode === 'equals');
// Marca lo que cumple, como en las tablas: la palabra buscada resaltada y las de $ y @ más claro; con Igual que no se marca.
function highlight(text) {
    const t = String(text == null ? '' : text);
    if (!query || mode === 'equals') return esc(t);
    let out = '';
    let at = 0;
    window.SearchSyntax.ranges(mode, searchTerms(query), t).forEach((r) => {
        out += `${esc(t.slice(at, r.start))}<mark${r.role === 'main' ? '' : ' class="aux"'}>${esc(t.slice(r.start, r.end))}</mark>`;
        at = r.end;
    });
    return out + esc(t.slice(at));
}
const fieldsSummary = () => (!fields.length ? TEXT.searchFieldsAll : (fields.length <= 2 ? fields.map((k) => TEXT.searchField[k]).join(', ') : fill(TEXT.searchSelected, { n: fields.length })));
function fieldsListHtml() {
    const opt = (key, label, checked, mixed) => `<label class="copt${key === 'all' ? ' all' : ''}${mixed ? ' mixed' : ''}"><input type="checkbox" data-field="${key}"${checked ? ' checked' : ''}><span class="box"></span><span>${esc(label)}</span></label>`;
    return opt('all', TEXT.searchFieldsAll, !fields.length, !!fields.length) + FIELD_KEYS.map((k) => opt(k, TEXT.searchField[k], fields.includes(k), false)).join('');
}
function panelHtml() {
    const modes = SEARCH_MODES.map((k) => `<button type="button" class="mopt" role="menuitemradio" data-mode="${k}" aria-pressed="${mode === k}">${esc(TEXT.searchModes[k])}</button>`).join('');
    const signs = Object.keys(SIGN_KEYS).map((s) => `<button type="button" class="mopt sg" role="menuitem" data-sign="${s}"><b aria-hidden="true">${s}</b><span>${esc(TEXT.searchSign[SIGN_KEYS[s]])}<small>${esc(TEXT.searchSignHelp[SIGN_KEYS[s]])}</small></span></button>`).join('');
    return `<div class="fmenu">
        <div class="mcur" id="mode-cur">${esc(TEXT.searchModes[mode])}</div>
        <div class="srow"><button type="button" class="fmode" id="modebtn" aria-haspopup="menu" aria-label="${esc(TEXT.searchMode)}" title="${esc(TEXT.searchMode)}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.sliders}</svg></button>
        <button type="button" class="fmode fsign" id="signbtn" aria-haspopup="menu" aria-label="${esc(TEXT.searchSigns)}" title="${esc(TEXT.searchSigns)}"><span aria-hidden="true">$@</span></button>
        <div class="sbox"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.search}</svg><input id="q" type="search" inputmode="search" enterkeyhint="search" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(TEXT.searchPlaceholder)}" aria-label="${esc(TEXT.search)}" value="${esc(query)}"><button type="button" class="sx" id="qclear" aria-label="${esc(TEXT.searchClear)}" title="${esc(TEXT.searchClear)}"${query ? '' : ' hidden'}>×</button></div>
        <div class="mpop" id="modepop" role="menu" aria-label="${esc(TEXT.searchMode)}" hidden>${modes}</div>
        <div class="mpop sign" id="signpop" role="menu" aria-label="${esc(TEXT.searchSigns)}" hidden>${signs}</div></div>
        <button type="button" class="sumrow" id="fieldstoggle" aria-expanded="false" aria-controls="fields"><span class="lbl">${esc(TEXT.searchTypes)}</span><b id="fields-sum">${esc(fieldsSummary())}</b><i aria-hidden="true"></i></button>
        <div class="flist" id="fields" role="group" aria-label="${esc(TEXT.searchTypes)}" hidden>${fieldsListHtml()}</div>
    </div>`;
}

// «Quién pide» y «Lugar que solicita»: en la tabla (computadora) van en el renglón del pedido; en la lista (celular) van ARRIBA de todo y la lista de códigos no se habilita hasta que estén llenos.
const whoFieldHtml = () => `<div><label for="name">${esc(TEXT.yourName)} <span class="req" aria-hidden="true">*</span></label><input type="text" id="name" maxlength="60" autocomplete="name" required placeholder="${esc(TEXT.namePlaceholder)}" value="${esc(nameValue)}"></div>`;
// Lugar que solicita: hospitales y otros sitios fuera del CEDIS del catálogo Lugares de Envío; si no hay ninguno dado de alta, el QR no lo pide
const placeFieldHtml = () => {
    const places = info.places || [];
    return places.length ? `<div><label for="place">${esc(TEXT.placeLabel)} <span class="req" aria-hidden="true">*</span></label><select id="place" class="place" required><option value="">${esc(TEXT.placeChoose)}</option>${places.map((p) => `<option value="${p.id}"${p.id === placeId ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>` : '';
};
let whoCollapsed = false; // la tarjeta de arriba (lista del celular): true = un renglón «Pide … · …» con «Cambiar»; false = sus dos campos
const whoSummaryText = () => { const p = (info.places || []).find((x) => x.id === placeId); return [String(nameValue || '').replace(/\s+/g, ' ').trim(), p ? p.name : ''].filter(Boolean).join(' · '); };
const whoCardInner = () => (whoCollapsed
    ? `<div class="whosum"><div><span class="whol">${esc(TEXT.whoNow)}</span><b>${esc(whoSummaryText())}</b></div><button type="button" class="link" data-whochange>${esc(TEXT.change)}</button></div>`
    : `${whoFieldHtml()}${placeFieldHtml()}${listReady() ? `<div class="whofoot"><button type="button" class="link" data-whodone>${esc(TEXT.sheetDoneEmpty)}</button></div>` : ''}`);
function setWhoCollapsed(v) {
    if (wide) return;
    whoCollapsed = v;
    const card = $('whocard');
    if (!card) return;
    card.classList.toggle('mini', v);
    card.innerHTML = whoCardInner();
}
const whoOk = () => !!String(nameValue || '').replace(/\s+/g, ' ').trim();
const listReady = () => whoOk() && !needPlace();
let listWasReady = null;
// Mientras falte quién pide o el lugar: la tarjeta «Buscar artículo» (y el código elegido) del celular NO aparece; la tabla de la computadora se apaga y no responde.
function syncLock() {
    const ok = listReady();
    ['searchcard', 'selbox'].forEach((id) => { const el = $(id); if (el) el.hidden = !ok; });
    const sc = document.querySelector('.scroll');
    if (sc) {
        sc.classList.toggle('locked', !ok);
        if (ok) sc.removeAttribute('inert'); else sc.setAttribute('inert', '');
    }
}
// Al escribir el nombre: solo cuando la lista pasa de bloqueada a habilitada (o al revés) se redibuja, para no mover nada mientras se sigue escribiendo.
function onWhoChange() {
    const ok = listReady();
    if (ok === listWasReady) return;
    listWasReady = ok;
    syncLock();
    if (wide) {
        // tabla: habilitada pide la primera página; bloqueada se vacía con su aviso (lo que se había escrito en el pedido se conserva)
        if (ok) loadCatalog(false);
        else { catSeq++; catalog = { items: [], total: 0, loading: false, loaded: true, added: [] }; drawTableBody(); }
        return;
    }
    drawResults();
    if (ok && isNarrow() && !catalog.loaded && !catalog.loading) loadCatalog(false);
}

// La página se arma una sola vez (encabezado, buscador, pedido) y después solo se redibujan resultados, cantidad elegida y pedido: así no se cierran los menús ni se pierde el cursor.
function view() {
    closePop();
    if (sentInfo) { viewSent(); return; }
    const locks = info.locks || {};
    // Sin tarjeta de título ni chip del centro: el encabezado de arriba (logo, «Pedido Manual», sitio y empresa) ya dice qué pantalla es y de dónde.
    if (!locks.register) { $('view').innerHTML = `<div class="card"><div class="msg">${esc(TEXT.viewOnly)}</div></div>`; return; }
    if (locks.signin && !info.signedIn) { $('view').innerHTML = `<div class="card"><div class="msg">${esc(TEXT.loginNeeded)}</div><a class="btn alt" style="text-align:center;text-decoration:none" href="/">${esc(TEXT.login)}</a><div class="muted" style="text-align:center">${esc(TEXT.loginHint)}</div></div>`; return; }
    // Lista (celular): el buscador es una tarjeta aparte y el artículo elegido se afina abajo. Tabla: el buscador va DENTRO de la celda «Artículo» de la tabla y al elegir un artículo se agrega su renglón para escribir cuánto quieres cada día.
    // En la lista (celular) PRIMERO se pide quién pide y el lugar que solicita (tarjeta de arriba) y ya después se habilita la lista de códigos.
    whoCollapsed = !wide && listReady(); // con quién pide y el lugar ya puestos (por ejemplo, el nombre de la cuenta y el último lugar) arranca como un renglón con «Cambiar»
    const whoCard = wide ? '' : `<div class="card${whoCollapsed ? ' mini' : ''}" id="whocard">${whoCardInner()}</div>`;
    const searchCard = wide ? '' : `<div class="card" id="searchcard"><h2>${esc(TEXT.searchTitle)}</h2>${panelHtml()}<div id="results"></div></div><div id="selbox"></div>`;
    $('view').innerHTML = `${whoCard}${searchCard}<div class="card" id="orderbox"></div>`;
    listWasReady = listReady();
    syncLock();
    drawResults(); drawSel(); drawOrder();
    if (isNarrow() && listReady() && !catalog.loaded && !catalog.loading) loadCatalog(false); // celular: la lista de códigos sale de inicio (ya con quién pide y el lugar)
}
// El final de cada resultado: «+» o, en el celular, lo que ya lleva ese código (cantidad total y cuántos días).
function rowEnd(r) {
    const c = isNarrow() ? entryOf(r.id) : null;
    if (c && c.parts.length) { const n = c.parts.length; return `<i class="got" aria-hidden="true">${esc(fmtQty(totalOf(c)))}<br>${esc(n === 1 ? TEXT.gotDay : fill(TEXT.gotDays, { d: n }))}</i>`; }
    return '<i class="plus" aria-hidden="true">+</i>';
}
function drawResults() {
    const box = $('results');
    if (!box) return;
    if (!wide && !listReady()) box.innerHTML = `<div class="msg">${esc(!whoOk() ? (needPlace() ? TEXT.fillFirst : TEXT.fillFirstNoPlace) : TEXT.pickPlace)}</div>`;
    else if (needPlace()) box.innerHTML = `<div class="msg">${esc(TEXT.pickPlace)}</div>`;
    else if ((info.places || []).length ? placeCount() === 0 : info.relatedCount === 0) box.innerHTML = `<div class="msg">${esc((info.places || []).length ? TEXT.noRelatedPlace : TEXT.noRelated)}</div>`;
    else if (isNarrow()) drawPhoneList(box);
    else if (!ready()) box.innerHTML = `<div class="msg">${esc(mode === 'contains' ? TEXT.typeMore : TEXT.typeOne)}</div>`;
    else if (!results.length) box.innerHTML = `<div class="msg">${esc(TEXT.none)}</div>`;
    else box.innerHTML = `<div class="list">${results.map((r, i) => `<button type="button" class="res" data-pick="${i}"><div><b>${highlight(r.code)}</b><span>${highlight(r.description)}</span><small>${highlight([r.uom, r.categories].filter(Boolean).join(' · '))}</small></div>${rowEnd(r)}</button>`).join('')}</div>${total > results.length ? `<div class="muted">${esc(TEXT.more)}</div>` : ''}`;
}
// Lista del celular: DE INICIO sale toda la lista de códigos del lugar (con su descripción única), como la columna «Artículo» de la tabla de la computadora: así quien no sabe qué buscar los reconoce y toca el que va. Lo escrito en el buscador
// la acota (mismo motor, con sus signos y «Buscar en»); por páginas de 100 con «Ver más». Tocar un código abre su hoja de día y cantidad.
const phoneRowHtml = (r, i) => `<button type="button" class="res" data-pick="${i}"><div><span class="rd">${highlight(r.description)}</span><small>${highlight([r.code, r.uom].filter(Boolean).join(' · '))}</small></div>${rowEnd(r)}</button>`;
function drawPhoneList(box) {
    if (!catalog.loaded) { box.innerHTML = `<div class="msg">${esc(TEXT.loading)}</div>`; return; }
    if (!catalog.items.length) { box.innerHTML = `<div class="msg">${esc(TEXT.none)}</div>`; return; }
    const old = $('phonelist');
    const keep = old ? old.scrollTop : 0; // al volver a dibujar (por ejemplo después de «Listo») la lista se queda donde estaba
    box.innerHTML = `<div class="list phonelist" id="phonelist">${catalog.items.map(phoneRowHtml).join('')}</div><div class="catfoot" id="catfoot">${catFootHtml()}</div>`;
    const now = $('phonelist');
    if (now && keep) now.scrollTop = keep;
}
// Una página más: se agregan al final de la lista sin redibujar las que ya están.
function appendPhoneRows(added) {
    const list = $('phonelist');
    if (!list) { drawResults(); return; }
    const from = catalog.items.length - added.length;
    list.insertAdjacentHTML('beforeend', added.map((r, k) => phoneRowHtml(r, from + k)).join(''));
    const foot = $('catfoot');
    if (foot) foot.innerHTML = catFootHtml();
}
function drawSel() {
    const box = $('selbox');
    if (!box) return;
    box.innerHTML = picked ? `<div class="card"><div class="sel"><b>${esc(picked.description)}</b><small>${esc([picked.code, picked.uom, picked.categories].filter(Boolean).join(' · '))}</small>
        <div class="qty"><button type="button" id="dec" aria-label="−">−</button><input type="number" id="qty" inputmode="decimal" step="any" min="0" value="${esc(picked.qty)}" aria-label="${esc(TEXT.qtyTitle)}"><button type="button" id="inc" aria-label="+">+</button><span>${esc(picked.uom)}</span></div>
        <div class="pickwhen"><label for="pickwhen">${esc(TEXT.needBy)}</label><select id="pickwhen" class="when">${whenOptions(picked.when || '')}</select></div>
        <button type="button" class="btn" id="add">${esc(TEXT.add)}</button><button type="button" class="link" id="cancel">${esc(TEXT.cancel)}</button></div></div>` : '';
}
// El pedido: SIEMPRE pide el nombre de quien pide (con sesión ya viene escrito el de la cuenta y se puede cambiar: quien manda no siempre es quien pide) y lo armado queda en un solo número de pedido con su lista de artículos.
// ---- Para cuándo: cada cantidad lleva su fecha (desde mañana y hasta 14 días, o «lo antes posible»). La lista del celular y la tabla por día de la pantalla ancha arman el MISMO pedido: cart = [{ id, code, description, uom, parts: [{ when, quantity }] }] ('' = lo antes posible).
const locale = LANG === 'en' ? 'en-US' : 'es-MX';
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const dayDate = (iso) => new Date(`${iso}T00:00:00Z`);
const addDaysIso = (iso, n) => { const d = dayDate(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const todayIso = () => (info && info.today) || new Date().toISOString().slice(0, 10);
const allDays = () => Array.from({ length: (info && info.maxDays) || 14 }, (_, i) => addDaysIso(todayIso(), i + 1));
const dayParts = (iso) => {
    const d = dayDate(iso);
    const f = (o) => new Intl.DateTimeFormat(locale, { timeZone: 'UTC', ...o }).format(d).replace('.', '');
    return { dow: f({ weekday: 'short' }), day: d.getUTCDate(), mon: f({ month: 'short' }), weekend: [0, 6].includes(d.getUTCDay()) };
};
const dayShort = (iso) => { const p = dayParts(iso); return `${cap(p.dow)} ${p.day} ${p.mon}`; };
const whenLabel = (w) => (w ? dayShort(w) : TEXT.asap);
const whenOptions = (selected) => `<option value=""${selected === '' ? ' selected' : ''}>${esc(TEXT.asap)}</option>${allDays().map((d) => `<option value="${d}"${selected === d ? ' selected' : ''}>${esc(dayShort(d))}</option>`).join('')}`;
const partOf = (c, when) => c.parts.find((p) => p.when === when);
const totalOf = (c) => Math.round(c.parts.reduce((s, p) => s + p.quantity, 0) * 1000) / 1000;
const articleCount = () => cart.filter((c) => c.parts.length).length;
// Lista o tabla: el botón lo elige y se recuerda en este aparato; sin elegir, manda el ancho de la pantalla (ancha: tabla; celular: lista).
function applyWide() {
    // celular (pantalla corta): siempre la lista con la hoja de cada código, sin tabla; pantalla ancha: la tabla por día, o la lista si así se eligió
    wide = isNarrow() ? false : (layoutPref ? layoutPref === 'table' : true);
    const m = document.querySelector('main');
    if (m) m.classList.toggle('wide', wide);
}
const layoutToggle = () => isNarrow() ? '' : `<div class="seg" role="group" aria-label="${esc(TEXT.layoutTitle)}"><button type="button" data-layout="list" aria-pressed="${!wide}">${esc(TEXT.layoutList)}</button><button type="button" data-layout="table" aria-pressed="${wide}">${esc(TEXT.layoutTable)}</button></div>`;
const headText = () => { const n = articleCount(); return `${esc(TEXT.yourOrder)} · ${esc(n === 1 ? TEXT.item1 : TEXT.items.replace('{n}', n))}`; };
function setQty(c, when, quantity) {
    const p = partOf(c, when);
    if (!(quantity > 0)) { if (p) c.parts.splice(c.parts.indexOf(p), 1); return; }
    if (p) p.quantity = quantity; else c.parts.push({ when, quantity });
}
// Lo que se manda: un renglón por artículo y fecha.
function flatLines() {
    const out = [];
    cart.forEach((c) => c.parts.forEach((p) => { if (p.quantity > 0) out.push({ id: c.id, code: c.code, description: c.description, uom: c.uom, quantity: p.quantity, needBy: p.when }); }));
    return out;
}
// Cambiar la fecha de todo el pedido: lo que iba a la fecha de antes se pasa a la nueva (lo que se puso aparte se respeta) y las cantidades de una misma fecha se juntan.
function setDefault(when) {
    const prev = defaultWhen;
    defaultWhen = when;
    cart.forEach((c) => {
        c.parts.forEach((p) => { if (p.when === prev) p.when = when; });
        const merged = [];
        c.parts.forEach((p) => { const same = merged.find((x) => x.when === p.when); if (same) same.quantity = Math.round((same.quantity + p.quantity) * 1000) / 1000; else merged.push(p); });
        c.parts = merged;
    });
    drawOrder();
}
// Lista (celular): fecha de todo el pedido arriba y, en cada artículo, su cantidad con su fecha; «+ Otra fecha» reparte el artículo en dos.
function drawOrderList() {
    if (isNarrow()) return drawOrderListPhone();
    const days = allDays();
    const chip = (when, label, sub) => `<button type="button" class="dchip" data-defwhen="${when}" aria-pressed="${defaultWhen === when}">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
    const rest = days.slice(3);
    const chips = chip('', TEXT.asap, '') + days.slice(0, 3).map((d, i) => { const p = dayParts(d); return i === 0 ? chip(d, TEXT.tomorrow, `${p.dow} ${p.day}`) : chip(d, `${cap(p.dow)} ${p.day}`, ''); }).join('')
        + `<select class="dsel${rest.includes(defaultWhen) ? ' on' : ''}" id="defother" aria-label="${esc(TEXT.otherDate)}"><option value="">${esc(TEXT.otherDate)}</option>${rest.map((d) => `<option value="${d}"${defaultWhen === d ? ' selected' : ''}>${esc(dayShort(d))}</option>`).join('')}</select>`;
    const top = `<div><label>${esc(TEXT.whenTitle)}</label><div class="chips">${chips}</div></div>`;
    const lines = !cart.length ? `<div class="msg">${esc(TEXT.empty)}</div>` : cart.map((c, i) => `<div class="oline"><div class="top"><span>${esc(c.description)}<small>${esc([c.code, c.uom].filter(Boolean).join(' · '))}</small></span><button type="button" class="rm" data-rm="${i}">${esc(TEXT.remove)}</button></div>`
        + c.parts.map((p, j) => `<div class="sub"><div class="q"><button type="button" data-pdec="${i}:${j}" aria-label="−">−</button><b>${esc(fmtQty(p.quantity))}</b><button type="button" data-pinc="${i}:${j}" aria-label="+">+</button><span class="u">${esc(c.uom)}</span></div><select class="when${p.when !== defaultWhen ? ' diff' : ''}" data-part="${i}:${j}" aria-label="${esc(TEXT.needBy)}">${whenOptions(p.when)}</select>${c.parts.length > 1 ? `<button type="button" class="rm" data-prm="${i}:${j}" aria-label="${esc(TEXT.remove)}">×</button>` : ''}</div>`).join('')
        + `<button type="button" class="split" data-addpart="${i}">${esc(TEXT.addDate)}</button></div>`).join('');
    return `${top}<div>${lines}</div>`;
}
// Lista del celular: cada artículo con un chip por día («Vie 13 · 10»); tocar el artículo o un chip abre su hoja para cambiar los días y las cantidades.
function drawOrderListPhone() {
    if (!cart.length) return `<div class="msg">${esc(TEXT.empty)}</div>`;
    return `<div>${cart.map((c, i) => `<div class="oline"><div class="top"><span>${esc(c.description)}<small>${esc([c.code, c.uom].filter(Boolean).join(' · '))}</small></span><div class="acts"><button type="button" class="link" data-edit="${i}">${esc(TEXT.change)}</button><button type="button" class="rm" data-rm="${i}">${esc(TEXT.remove)}</button></div></div><div class="pchips">${sortedParts(c).map((p) => `<button type="button" class="pc${p.when && dayParts(p.when).weekend ? ' we' : ''}" data-edit="${i}" data-editday="${esc(p.when)}">${esc(whenLabel(p.when))} <b>${esc(fmtQty(p.quantity))}</b></button>`).join('')}</div></div>`).join('')}</div>`;
}
// Tabla por día (pantalla ancha), como la maqueta: DE INICIO sale toda la lista de códigos (con su descripción única), un renglón por código y una columna por día (los próximos 7; «+ Otra fecha» agrega más, hasta 14). «Lo antes posible»
// sale como columna solo si se usa o se agrega. Se escribe la cantidad en el día que se quiera; lo que no lleva cantidad no se pide. Cada encabezado lleva su filtro (el embudo): Artículo filtra la lista (Contiene, Inicia con,
// Igual que, signos, «Buscar en»); cada día y Total muestran solo los artículos que llevan cantidad.
let showAsap = false;
let tblFilter = { days: new Set(), total: false };
let pop = null; // el filtro abierto: { kind: 'art' | 'total' | 'day:AAAA-MM-DD', anchor }
const FUNNEL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.2 7.2V18l-3.6-1.8v-4z"/></svg>';
const fbtn = (kind, active, label) => `<button type="button" class="fbtn${active ? ' on' : ''}" data-filter="${esc(kind)}" aria-label="${esc(label)}" title="${esc(label)}">${FUNNEL}</button>`;
let catalog = { items: [], total: 0, loading: false, loaded: false }; // la lista de códigos de la tabla (por páginas de 100)
let catSeq = 0;
const entryOf = (id) => cart.find((c) => c.id === id);
const findItem = (id) => catalog.items.find((it) => it.id === id);
const filterActive = () => tblFilter.total || tblFilter.days.size > 0;
// ¿El artículo pasa los filtros de los encabezados de cantidad? (solo se revisa al dibujar la tabla, no al escribir: un renglón no desaparece mientras se le escribe)
const rowVisible = (c) => (!tblFilter.total || totalOf(c) > 0) && [...tblFilter.days].every((w) => { const part = partOf(c, w); return !!part && part.quantity > 0; });
// Pide la lista (la primera página o, con append, la siguiente) con el filtro del encabezado Artículo.
async function loadCatalog(append) {
    const my = ++catSeq;

    const end = input.selectionEnd == null ? start : input.selectionEnd;
    const text = sign === ',' ? ', ' : sign;
    input.value = input.value.slice(0, start) + text + input.value.slice(end);
    input.focus();
    try { input.setSelectionRange(start + text.length, start + text.length); } catch (e) { /* algunos teclados no dejan mover el cursor */ }
    query = input.value;
    queueSearch();
}
function drawMode() {
    $('mode-cur').textContent = TEXT.searchModes[mode];
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === mode)));
    document.querySelectorAll('[data-sign]').forEach((b) => { const off = signOff(b.getAttribute('data-sign')); b.disabled = off; if (off) b.title = TEXT.searchSignOff; else b.removeAttribute('title'); });
    $('modepop').hidden = true; $('signpop').hidden = true;
}
function setField(key, checked) {
    if (key === 'all') fields = [];
    else {
        const set = new Set(fields);
        if (checked) set.add(key); else set.delete(key);
        fields = FIELD_KEYS.filter((k) => set.has(k));
        if (fields.length === FIELD_KEYS.length) fields = [];
    }
    $('fields').innerHTML = fieldsListHtml();
    $('fields-sum').textContent = fieldsSummary();
    search();
}

// Un solo oyente para todo lo que se toca en la página.
$('view').addEventListener('click', (event) => {
    const t = event.target;
    const fb = t.closest('[data-filter]');
    if (fb) { const kind = fb.getAttribute('data-filter'); if (pop && pop.kind === kind) closePop(); else openPop(kind, fb); return; }
    if (pop && !t.closest('#fpop')) closePop();
    const modePop = $('modepop');
    const signPop = $('signpop');
    if (modePop && !modePop.hidden && !t.closest('#modebtn') && !t.closest('#modepop')) modePop.hidden = true;
    if (signPop && !signPop.hidden && !t.closest('#signbtn') && !t.closest('#signpop')) signPop.hidden = true;
    if (t.closest('#modebtn')) { modePop.hidden = !modePop.hidden; signPop.hidden = true; return; }
    if (t.closest('#signbtn')) { signPop.hidden = !signPop.hidden; modePop.hidden = true; return; }
    const sign = t.closest('[data-sign]');
    if (sign) { if (!sign.disabled) insertSign(sign.getAttribute('data-sign')); signPop.hidden = true; return; }
    const modeBtn = t.closest('[data-mode]');
    if (modeBtn) { mode = modeBtn.getAttribute('data-mode'); drawMode(); search(); return; }
    const toggle = t.closest('#fieldstoggle');
    if (toggle) { const list = $('fields'); list.hidden = !list.hidden; toggle.setAttribute('aria-expanded', String(!list.hidden)); return; }
    if (t.closest('#qclear')) { const q = $('q'); q.value = ''; query = ''; queueSearch(); q.focus(); return; }
    const pick = t.closest('[data-pick]');
    if (pick && isNarrow()) { openSheet(catalog.items[Number(pick.getAttribute('data-pick'))]); return; } // celular: la hoja del código
    const edit = t.closest('[data-edit]');
    if (edit) { const c = cart[Number(edit.getAttribute('data-edit'))]; if (c) openSheet(c, edit.hasAttribute('data-editday') ? edit.getAttribute('data-editday') : undefined); return; }
    if (pick) { picked = { ...results[Number(pick.getAttribute('data-pick'))], qty: 1, when: defaultWhen }; drawSel(); const qi = $('qty'); if (qi) { qi.focus(); qi.select(); } return; }
    if (t.closest('#dec')) { picked.qty = Math.max(1, Math.round((Number(picked.qty) || 1) - 1)); $('qty').value = picked.qty; return; }
    if (t.closest('#inc')) { picked.qty = Math.round((Number(picked.qty) || 0) + 1); $('qty').value = picked.qty; return; }
    if (t.closest('#add')) { addPicked(); return; }
    if (t.closest('#cancel')) { picked = null; drawSel(); return; }
    // una cantidad con su fecha (lista del celular): data-attr="artículo:renglón"
    const part = (attr) => { const el = t.closest(`[${attr}]`); if (!el) return null; const [i, j] = el.getAttribute(attr).split(':').map(Number); const c = cart[i]; return c && c.parts[j] ? { c, p: c.parts[j], j } : null; };
    const pdec = part('data-pdec');
    if (pdec) { pdec.p.quantity = Math.max(1, Math.round(pdec.p.quantity - 1)); drawOrder(); return; }
    const pinc = part('data-pinc');
    if (pinc) { pinc.p.quantity = Math.round(pinc.p.quantity + 1); drawOrder(); return; }
    const prm = part('data-prm');
    if (prm) { prm.c.parts.splice(prm.j, 1); drawOrder(); return; }
    const addpart = t.closest('[data-addpart]');
    if (addpart) {
        const c = cart[Number(addpart.getAttribute('data-addpart'))];
        // la fecha de la nueva cantidad: el primer día que ese artículo todavía no tiene
        const free = ['', ...allDays()].find((w) => !partOf(c, w));
        if (c && free !== undefined) { c.parts.push({ when: free, quantity: 1 }); drawOrder(); }
        return;
    }
    const lay = t.closest('[data-layout]');
    if (lay) { layoutPref = lay.getAttribute('data-layout'); store.set(KEY_LAYOUT, layoutPref); applyWide(); view(); return; }
    const clear = t.closest('[data-clear]');
    if (clear) { const id = Number(clear.getAttribute('data-clear')); cart = cart.filter((c) => c.id !== id); if (filterActive()) drawOrder(); else drawTableBody(); return; }
    if (t.closest('[data-more]')) { loadCatalog(true); return; }
    const defwhen = t.closest('[data-defwhen]');
    if (defwhen) { setDefault(defwhen.getAttribute('data-defwhen')); return; }
    const rm = t.closest('[data-rm]');
    if (rm) { cart.splice(Number(rm.getAttribute('data-rm')), 1); drawOrder(); drawResults(); return; }
    if (t.closest('[data-whochange]')) { setWhoCollapsed(false); const n = $('name'); if (n) n.focus(); return; }
    if (t.closest('[data-whodone]')) { if (listReady()) setWhoCollapsed(true); else { const n = !whoOk() ? $('name') : $('place'); if (n) n.focus(); } return; }
    if (t.closest('#send')) openClose();
});
$('view').addEventListener('input', (event) => {
    const t = event.target;
    if (t.id === 'q') { query = t.value; queueSearch(); }
    else if (t.id === 'qty' && picked) picked.qty = t.value;
    else if (t.id === 'name') { nameValue = t.value; onWhoChange(); }
    else if (t.id === 'place') {
        const next = Number(t.value) || 0;
        if (next === placeId) return;
        // cada lugar tiene sus propios códigos: lo que ya se escribió en el pedido es de la lista del lugar anterior
        if (cart.length && !window.confirm(TEXT.changePlace)) { t.value = String(placeId || ''); return; }
        placeId = next;
        store.set(KEY_PLACE, String(placeId || ''));
        cart = [];
        picked = null;
        results = []; total = 0;
        catalog = { items: [], total: 0, loading: false, loaded: false, added: [] };
        listWasReady = listReady();
        drawOrder();
        if (!wide) { listWasReady = listReady(); syncLock(); drawResults(); drawSel(); if (listReady()) { if (isNarrow()) loadCatalog(false); else if (ready()) search(); } }
        if (!wide && listReady()) setWhoCollapsed(true);
    }
    else if (t.dataset && t.dataset.item !== undefined) {
        // una casilla de la tabla por día: código y fecha; el código entra al pedido al ponerle una cantidad y sale si se queda sin ninguna
        const id = Number(t.dataset.item);
        const w = t.dataset.when || '';
        let c = entryOf(id);
        if (!c) { const it = findItem(id); if (!it) return; c = { id, code: it.code, description: it.description, uom: it.uom, parts: [] }; cart.push(c); }
        const n = Number(String(t.value).replace(',', '.'));
        const q = Number.isFinite(n) && n > 0 ? Math.round(n * 1000) / 1000 : 0;
        setQty(c, w, q);
        if (!c.parts.length) cart.splice(cart.indexOf(c), 1);
        t.classList.toggle('on', q > 0);
        refreshTable();
    }
});
$('view').addEventListener('change', (event) => {
    const t = event.target;
    const box = t.closest('[data-field]');
    if (box) { setField(box.getAttribute('data-field'), box.checked); return; }
    if (t.id === 'pickwhen' && picked) { picked.when = t.value; return; }
    if (t.id === 'defother') { setDefault(t.value); return; }
    if (t.id === 'addcol') { if (t.value === '__asap') showAsap = true; else if (t.value) extraCols.push(t.value); if (t.value) drawOrder(); return; }
    const dayFilter = t.getAttribute && t.getAttribute('data-dayfilter');
    if (dayFilter !== null && dayFilter !== undefined) { if (t.checked) tblFilter.days.add(dayFilter); else tblFilter.days.delete(dayFilter); drawOrder(); return; }
    if (t.hasAttribute && t.hasAttribute('data-totalfilter')) { tblFilter.total = t.checked; drawOrder(); return; }
    const pw = t.getAttribute && t.getAttribute('data-part');
    if (pw) {
        // otra fecha para esa cantidad; si el artículo ya tiene cantidad en esa fecha, se juntan
        const [i, j] = pw.split(':').map(Number);
        const c = cart[i];
        const p = c && c.parts[j];
        if (!p) return;
        const same = c.parts.find((x, k) => k !== j && x.when === t.value);
        if (same) { same.quantity = Math.round((same.quantity + p.quantity) * 1000) / 1000; c.parts.splice(j, 1); } else p.when = t.value;
        drawOrder();
    }
});

// ---- «Cerrar pedido…»: al tocar el botón sube una hoja con DOS cosas: descargar el listado (PDF o Excel: solo baja el archivo y la hoja se queda, para poder enviar después) o enviar el pedido como siempre. ----
const ICON_PDF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>';
const ICON_XLS = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>';
const fmtButtons = () => `<div class="two"><button type="button" class="fmt pdf" data-dl="pdf">${ICON_PDF}${esc(TEXT.fmtPdf)}</button><button type="button" class="fmt xl" data-dl="xlsx">${ICON_XLS}${esc(TEXT.fmtXlsx)}</button></div>`;
const localStamp = (d) => d.toLocaleString(LANG === 'en' ? 'en-US' : 'es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function saveBlob(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
}
function closeClose() {
    const wrap = $('closewrap');
    if (wrap) wrap.remove();
    if (!sheet) document.body.classList.remove('sheet-open');
}
function openClose() {
    closeClose();
    const lines = flatLines();
    if (!lines.length) return;
    const n = new Set(lines.map((l) => l.id)).size;
    const wrap = document.createElement('div');
    wrap.className = 'shwrap';
    wrap.id = 'closewrap';
    wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(TEXT.closeTitle)}" tabindex="-1"><div class="grab" aria-hidden="true"></div>
        <div class="shead"><div><b>${esc(TEXT.closeTitle)}</b><small>${esc(n === 1 ? TEXT.item1 : TEXT.items.replace('{n}', n))}</small></div><button type="button" class="shx" data-clclose aria-label="${esc(TEXT.close)}">✕</button></div>
        <div class="opt"><span class="tt">${esc(TEXT.dlList)}</span>${fmtButtons()}</div>
        <div class="opt"><span class="tt">${esc(TEXT.send)}</span><button type="button" class="btn ok" id="clsend" title="${esc(TEXT.stamp)}">${esc(TEXT.send)}</button></div>
        <div class="err" id="clerr" role="alert" hidden></div><div class="clnote" id="clnote" role="status" hidden></div>
        <button type="button" class="btn alt" data-clclose>${esc(TEXT.cancel)}</button></div>`;
    document.body.appendChild(wrap);
    document.body.classList.add('sheet-open');
    wrap.addEventListener('click', (event) => {
        const t = event.target;
        if (t.id === 'closewrap' || t.closest('[data-clclose]')) { closeClose(); return; }
        const dl = t.closest('[data-dl]');
        if (dl) { downloadList(dl.getAttribute('data-dl')); return; }
        if (t.closest('#clsend')) sendOrder();
    });
    const card = wrap.querySelector('.sheet');
    if (card) card.focus({ preventScroll: true });
}
// El listado del pedido (armado o ya enviado) en PDF o Excel: lo arma el servidor con los datos de cada código; aquí solo se manda qué artículos, cuánto y para cuándo, y se baja el archivo.
async function downloadList(format, ctx) {
    const c = ctx || { lines: flatLines(), folio: '', name: nameValue, placeId, when: localStamp(new Date()) };
    const note = $('clnote') || $('dlnote');
    const btns = [...document.querySelectorAll('[data-dl]')];
    const err = $('clerr');
    if (err) err.hidden = true;
    btns.forEach((b) => { b.disabled = true; });
    if (note) { note.textContent = TEXT.preparing; note.hidden = false; }
    try {
        const res = await fetch(`${API}/export`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ format, lang: LANG, name: String(c.name || '').replace(/\s+/g, ' ').trim(), ...((info.places || []).length ? { placeId: c.placeId } : {}), folio: c.folio || '', when: c.when || '', items: c.lines.map((l) => ({ id: l.id, quantity: l.quantity, needBy: l.needBy })) }) });
        if (!res.ok) throw new Error('export');
        const file = `${LANG === 'en' ? 'Order' : 'Pedido'}-${c.folio || (LANG === 'en' ? 'draft' : 'borrador')}_${todayIso()}.${format}`;
        saveBlob(await res.blob(), file);
        if (note) { note.textContent = fill(TEXT.downloaded, { f: file }); note.hidden = false; }
    } catch (e) {
        if (note) { note.textContent = TEXT.errDownload; note.hidden = false; }
    } finally {
        btns.forEach((b) => { b.disabled = false; });
    }
}
// Se manda desde la hoja «Cerrar pedido»: su botón dice «Enviando…» y sus avisos salen en la hoja (si falta nombre o lugar, la hoja se cierra y el aviso sale arriba, junto al campo).
async function sendOrder() {
    const mainErr = $('err');
    const failMain = (text) => { mainErr.textContent = text; mainErr.hidden = false; };
    mainErr.hidden = true;
    const err = $('clerr') || mainErr;
    const fail = (text) => { err.textContent = text; err.hidden = false; };
    err.hidden = true;
    const name = nameValue.replace(/\s+/g, ' ').trim();
    if (!name) { closeClose(); failMain(TEXT.needName); setWhoCollapsed(false); $('name').focus(); return; }
    if ((info.places || []).length && !placeId) { closeClose(); failMain(TEXT.needPlace); setWhoCollapsed(false); $('place').focus(); return; }
    if (!flatLines().length) { closeClose(); failMain(TEXT.errItems); return; }
    const btn = $('clsend') || $('send');
    const idleLabel = btn.id === 'clsend' ? TEXT.send : TEXT.closeOrder;
    btn.disabled = true;
    btn.textContent = TEXT.sending;
    const items = flatLines();
    try {
        const res = await fetch(`${API}/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, ...((info.places || []).length ? { placeId } : {}), items: items.map((c) => ({ id: c.id, quantity: c.quantity, needBy: c.needBy })) }) });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
            btn.disabled = false; btn.textContent = idleLabel;
            if (body.code === 'LOCKED') { closeClose(); info.locks.register = false; view(); return; }
            if (body.code === 'LOGIN') { closeClose(); info.locks.signin = true; info.signedIn = false; view(); return; }
            fail(body.code === 'NAME' ? TEXT.needName : (body.code === 'PLACE' ? TEXT.needPlace : (body.code === 'QTY' ? TEXT.errQty : (body.code === 'ITEMS' ? TEXT.errItems : (body.code === 'TOOMANY' ? TEXT.tooMany : (body.code === 'RELATED' ? TEXT.errRelated : (body.code === 'DATE' ? TEXT.errDate : TEXT.errGeneric)))))));
            return;
        }
        store.set(KEY_NAME, name);
        sentInfo = { folio: body.folio, name: body.name, place: body.place || '', placeId, createdAt: body.createdAt, items };
        cart = [];
        closeClose();
        view();
    } catch (e) {
        btn.disabled = false; btn.textContent = idleLabel;
        fail(TEXT.errGeneric);
    }
}
// Lo enviado: el número de pedido y su lista de artículos.
function viewSent() {
    const when = new Date(sentInfo.createdAt).toLocaleString(LANG === 'en' ? 'en-US' : 'es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const lines = sentInfo.items.map((c) => `<div class="line"><span>${esc(c.description)}<small>${esc([c.code, c.uom, `${TEXT.needBy}: ${whenLabel(c.needBy)}`].filter(Boolean).join(' · '))}</small></span><div class="q"><b>${esc(fmtQty(c.quantity))}</b></div></div>`).join('');
    $('view').innerHTML = `<div class="card done"><div class="tick" aria-hidden="true">✓</div><h1>${esc(TEXT.sentTitle)}</h1><div class="muted">${esc(TEXT.folio)}</div><div class="folio">${esc(sentInfo.folio)}</div>
        <div>${esc(TEXT.by)}: <b>${esc(sentInfo.name)}</b></div>${sentInfo.place ? `<div>${esc(TEXT.placeAt)}: <b>${esc(sentInfo.place)}</b></div>` : ''}<div>${esc(TEXT.at)}: <b>${esc(when)}</b></div>
        <div class="items"><h2>${esc(TEXT.list)} · ${esc(sentInfo.items.length === 1 ? TEXT.item1 : TEXT.items.replace('{n}', sentInfo.items.length))}</h2>${lines}</div>
        <div class="dl"><span class="tt">${esc(TEXT.dlThis)}</span>${fmtButtons()}<div class="clnote" id="dlnote" role="status" hidden></div></div>
        <button type="button" class="btn" id="again">${esc(TEXT.newOrder)}</button></div>`;
    $('view').querySelectorAll('[data-dl]').forEach((b) => b.addEventListener('click', () => downloadList(b.getAttribute('data-dl'), { lines: sentInfo.items, folio: sentInfo.folio, name: sentInfo.name, placeId: sentInfo.placeId, when: localStamp(new Date(sentInfo.createdAt)) })));
    $('again').addEventListener('click', () => { sentInfo = null; query = ''; results = []; total = 0; picked = null; view(); });
}

(async function init() {
    $('view').innerHTML = `<div class="card"><div class="muted">${esc(TEXT.loading)}</div></div>`;
    try {
        const res = await fetch(API, { cache: 'no-store' });
        if (!res.ok) throw new Error('not found');
        info = await res.json();
    } catch (err) { $('view').innerHTML = `<div class="card"><div class="err" role="alert">${esc(TEXT.notFound)}</div></div>`; return; }
    // el mismo encabezado del Layout: logo (o iniciales), tipo de página, Sitio y empresa
    window.QrBrandHeader.mount($('qr-brand'), { kind: TEXT.title, siteName: info.siteName, companyName: info.companyName, hasLogo: info.hasLogo, companyColor: info.companyColor, logoUrl: `/api/public/layout/${encodeURIComponent(TOKEN)}/logo` });
    if (!nameValue && info.signedIn) nameValue = info.userName || '';
    if (!(info.places || []).some((p) => p.id === placeId)) placeId = 0; // el lugar que se recordaba ya no está en el catálogo (o está inactivo)
    // pantalla ancha (la computadora, la ventana de QR's): la tabla por día; angosta (el celular): la lista. Al cambiar el ancho se vuelve a dibujar el mismo pedido.
    mq = window.matchMedia('(min-width: 780px)');
    applyWide();
    mq.addEventListener('change', () => { closeSheet(); closeClose(); applyWide(); view(); });
    view();
})();
})();
</script>
