<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Pedido Manual</title>
    <link rel="icon" href="/icons/icon-512.png">
    <style>
        :root{
            --bg:#f6eef8; --surface:#ffffff; --ink:#2a1b30; --muted:#7a6a80; --line:#e4d2e9; --accent:#7d3f8f; --ok:#2e8b57; --warn:#c0392b; --shadow:0 10px 26px rgba(60,20,70,.14);
        }
        @media (prefers-color-scheme: dark){
            :root{ --bg:#1d1422; --surface:#2a1d31; --ink:#f3e8f6; --muted:#b9a5c0; --line:#493556; --accent:#d3a2e6; --ok:#5cc58a; --warn:#ff8a7a; --shadow:0 10px 26px rgba(0,0,0,.5); }
        }
        *{ box-sizing:border-box; }
        html,body{ margin:0; min-height:100%; }
        body{ background:var(--bg); color:var(--ink); font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:14px 14px 36px; display:flex; justify-content:center; }
        main{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:12px; }
        .card{ background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:12px; }
        h1{ font-size:20px; margin:0; }
        h2{ font-size:15px; margin:0; }
        .chip{ display:inline-flex; align-items:center; gap:6px; width:max-content; max-width:100%; font-weight:600; font-size:14px; padding:4px 12px; border:1px solid var(--line); border-radius:999px; }
        label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
        input[type=text], input[type=search], input[type=number]{ width:100%; font:500 16px system-ui,sans-serif; padding:11px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); }
        input:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
        .btn{ font:600 16px system-ui,sans-serif; padding:14px 16px; border-radius:16px; border:0; background:var(--ink); color:var(--surface); cursor:pointer; width:100%; }
        .btn.alt{ background:transparent; color:var(--ink); border:1px solid var(--line); }
        .btn.ok{ background:var(--ok); color:#fff; }
        .btn[disabled]{ opacity:.55; cursor:default; }
        .link{ background:none; border:0; color:var(--accent); font:600 14px system-ui,sans-serif; padding:8px; cursor:pointer; text-align:center; }
        .chips{ display:flex; flex-wrap:wrap; gap:6px; }
        .chips button{ font:600 13px system-ui,sans-serif; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
        .chips button[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
        .list{ display:flex; flex-direction:column; gap:8px; }
        .res{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; border:1px solid var(--line); border-radius:14px; padding:8px 10px; background:var(--surface); text-align:left; width:100%; cursor:pointer; font:inherit; color:inherit; }
        .res b{ font-size:13px; font-variant-numeric:tabular-nums; display:block; }
        .res span{ display:block; font-size:15px; }
        .res small{ color:var(--muted); font-size:12px; }
        .plus{ width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:20px; font-weight:700; }
        .sel{ border:1px solid var(--accent); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .sel b{ font-size:16px; }
        .sel small{ color:var(--muted); font-size:12px; }
        .qty{ display:flex; align-items:center; justify-content:center; gap:12px; }
        .qty button{ width:46px; height:46px; border-radius:50%; border:1.5px solid var(--accent); background:transparent; color:var(--accent); font-size:24px; font-weight:700; cursor:pointer; }
        .qty input{ width:110px; text-align:center; font-size:26px; font-weight:700; padding:8px; }
        .qty span{ font-size:13px; color:var(--muted); min-width:34px; }
        .line{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; border-bottom:1px solid var(--line); padding:6px 0; }
        .line span{ font-size:14px; }
        .line small{ color:var(--muted); font-size:12px; display:block; }
        .line .q{ display:flex; align-items:center; gap:6px; }
        .line .q button{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer; }
        .line .q b{ min-width:44px; text-align:center; font-variant-numeric:tabular-nums; }
        .line .rm{ border:0; background:none; color:var(--warn); font-size:12px; cursor:pointer; padding:2px 6px; }
        .msg{ color:var(--muted); font-size:13px; border:1px dashed var(--line); border-radius:14px; padding:10px 12px; text-align:center; }
        .err{ color:var(--warn); font-size:14px; border:1px solid var(--warn); border-radius:14px; padding:10px 12px; }
        .muted{ color:var(--muted); font-size:13px; }
        .done{ text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center; }
        .done .folio{ font:700 32px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.04em; }
        .tick{ width:56px; height:56px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:30px; }
        @media (prefers-reduced-motion: no-preference){ .card{ animation:rise .25s ease-out; } @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } } }
    </style>
</head>
<body>
<main>
    <div id="qr-brand"></div>
    <div id="view"></div>
</main>
<script src="/QrBrandHeader.js"></script>
<script>
(function () {
'use strict';
const LANG = (navigator.language || 'es').toLowerCase().startsWith('en') ? 'en' : 'es';
const TEXT = {
    es: {
        title: 'Pedido Manual', loading: 'Cargando…', notFound: 'Este QR ya no corresponde a ningún centro de costos.', searchTitle: 'Buscar artículo', searchPlaceholder: 'Código, descripción, UdM o categoría',
        fAll: 'Todo', fCode: 'Código', fDesc: 'Descripción', fUom: 'UdM', fCat: 'Categoría', typeMore: 'Escribe al menos 2 letras o números.', none: 'No se encontró nada con eso.', more: 'Hay más resultados: escribe más para acotar.',
        qtyTitle: 'Cantidad', add: 'Agregar al pedido', cancel: 'Cancelar', yourOrder: 'Tu pedido', items: '{n} artículos', item1: '1 artículo', empty: 'Todavía no agregas nada. Busca un artículo y elige la cantidad.', remove: 'Quitar',
        yourName: 'Tu nombre', namePlaceholder: 'Quién pide', signedAs: 'Pides como', send: 'Enviar pedido', sending: 'Enviando…', stamp: 'Se guarda con tu nombre y la hora en que lo envías.',
        needName: 'Escribe tu nombre para enviar.', errGeneric: 'No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.', errQty: 'Una cantidad no es válida.', errItems: 'Agrega al menos un artículo.',
        sentTitle: 'Pedido enviado', folio: 'Folio', by: 'Pidió', at: 'Hora', newOrder: 'Nuevo pedido', viewOnly: 'Este QR solo sirve para consultar.', loginNeeded: 'Este QR pide iniciar sesión para enviar pedidos.',
        login: 'Iniciar sesión', loginHint: 'Inicia sesión en el sistema y vuelve a abrir este QR.', locked: 'Este QR ya no permite enviar pedidos.', tooMany: 'Un pedido lleva hasta 40 artículos.',
    },
    en: {
        title: 'Manual Order', loading: 'Loading…', notFound: 'This QR no longer matches any cost center.', searchTitle: 'Find an item', searchPlaceholder: 'Code, description, UoM or category',
        fAll: 'All', fCode: 'Code', fDesc: 'Description', fUom: 'UoM', fCat: 'Category', typeMore: 'Type at least 2 letters or numbers.', none: 'Nothing was found.', more: 'There are more results: type more to narrow them.',
        qtyTitle: 'Quantity', add: 'Add to the order', cancel: 'Cancel', yourOrder: 'Your order', items: '{n} items', item1: '1 item', empty: 'You have not added anything yet. Find an item and choose the quantity.', remove: 'Remove',
        yourName: 'Your name', namePlaceholder: 'Who is ordering', signedAs: 'Ordering as', send: 'Send order', sending: 'Sending…', stamp: 'It is saved with your name and the time you send it.',
        needName: 'Type your name to send.', errGeneric: 'It could not be sent. Check your connection and try again.', errQty: 'A quantity is not valid.', errItems: 'Add at least one item.',
        sentTitle: 'Order sent', folio: 'Folio', by: 'Ordered by', at: 'Time', newOrder: 'New order', viewOnly: 'This QR is for viewing only.', loginNeeded: 'This QR requires signing in to send orders.',
        login: 'Sign in', loginHint: 'Sign in to the system and open this QR again.', locked: 'This QR no longer allows sending orders.', tooMany: 'An order takes up to 40 items.',
    },
}[LANG];
document.documentElement.lang = LANG;
document.title = TEXT.title;

// La dirección fija del QR: /pm/<código del Layout del centro de costos>
const parts = location.pathname.split('/').filter(Boolean);
const TOKEN = parts[1] || '';
const API = `/api/public/pedido-manual/${encodeURIComponent(TOKEN)}`;
const KEY_NAME = 'sgn_pm_name';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
    get(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* sin almacenamiento */ } },
};
const fmtQty = (n) => Number(n).toLocaleString(LANG === 'en' ? 'en-US' : 'es-MX', { maximumFractionDigits: 3 });
let info = null;
let field = 'all';
let query = '';
let results = [];
let total = 0;
let picked = null;
let cart = [];
let sentInfo = null;
let timer = null;
let seq = 0;

function view() {
    if (sentInfo) return viewSent();
    const locks = info.locks || {};
    const blocked = !locks.register ? `<div class="card"><div class="msg">${esc(TEXT.viewOnly)}</div></div>`
        : (locks.signin && !info.signedIn ? `<div class="card"><div class="msg">${esc(TEXT.loginNeeded)}</div><a class="btn alt" style="text-align:center;text-decoration:none" href="/">${esc(TEXT.login)}</a><div class="muted" style="text-align:center">${esc(TEXT.loginHint)}</div></div>` : '');
    const header = `<div class="card"><h1>${esc(TEXT.title)}</h1>${info.costCenter ? `<span class="chip">${esc((info.costCenter.code ? `${info.costCenter.code} · ` : '') + info.costCenter.name)}</span>` : ''}</div>`;
    if (blocked) { $('view').innerHTML = header + blocked; return; }
    const fields = [['all', TEXT.fAll], ['code', TEXT.fCode], ['desc', TEXT.fDesc], ['uom', TEXT.fUom], ['cat', TEXT.fCat]];
    let resultsHtml = '';
    if (query.trim().length < 2) resultsHtml = `<div class="msg">${esc(TEXT.typeMore)}</div>`;
    else if (!results.length) resultsHtml = `<div class="msg">${esc(TEXT.none)}</div>`;
    else resultsHtml = `<div class="list">${results.map((r, i) => `<button type="button" class="res" data-pick="${i}"><div><b>${esc(r.code)}</b><span>${esc(r.description)}</span><small>${esc([r.uom, r.categories].filter(Boolean).join(' · '))}</small></div><i class="plus" aria-hidden="true">+</i></button>`).join('')}</div>${total > results.length ? `<div class="muted">${esc(TEXT.more)}</div>` : ''}`;
    const search = `<div class="card"><h2>${esc(TEXT.searchTitle)}</h2>
        <input type="search" id="q" value="${esc(query)}" placeholder="${esc(TEXT.searchPlaceholder)}" autocomplete="off" enterkeyhint="search">
        <div class="chips" role="group">${fields.map(([k, label]) => `<button type="button" data-field="${k}" aria-pressed="${field === k}">${esc(label)}</button>`).join('')}</div>
        <div id="results">${resultsHtml}</div></div>`;
    const sel = picked ? `<div class="card"><div class="sel"><b>${esc(picked.description)}</b><small>${esc([picked.code, picked.uom, picked.categories].filter(Boolean).join(' · '))}</small>
        <div class="qty"><button type="button" id="dec" aria-label="−">−</button><input type="number" id="qty" inputmode="decimal" step="any" min="0" value="${esc(picked.qty)}" aria-label="${esc(TEXT.qtyTitle)}"><button type="button" id="inc" aria-label="+">+</button><span>${esc(picked.uom)}</span></div>
        <button type="button" class="btn" id="add">${esc(TEXT.add)}</button><button type="button" class="link" id="cancel">${esc(TEXT.cancel)}</button></div></div>` : '';
    const lines = cart.length ? cart.map((c, i) => `<div class="line"><span>${esc(c.description)}<small>${esc([c.code, c.uom].filter(Boolean).join(' · '))}</small></span><div class="q"><button type="button" data-dec="${i}" aria-label="−">−</button><b>${esc(fmtQty(c.quantity))}</b><button type="button" data-inc="${i}" aria-label="+">+</button><button type="button" class="rm" data-rm="${i}">${esc(TEXT.remove)}</button></div></div>`).join('') : `<div class="msg">${esc(TEXT.empty)}</div>`;
    const who = info.signedIn ? `<div class="muted">${esc(TEXT.signedAs)} <b>${esc(info.userName)}</b></div>` : `<div><label for="name">${esc(TEXT.yourName)}</label><input type="text" id="name" maxlength="60" autocomplete="name" placeholder="${esc(TEXT.namePlaceholder)}" value="${esc(store.get(KEY_NAME))}"></div>`;
    const order = `<div class="card"><h2>${esc(TEXT.yourOrder)} · ${esc(cart.length === 1 ? TEXT.item1 : TEXT.items.replace('{n}', cart.length))}</h2>${lines}${cart.length ? `${who}<button type="button" class="btn ok" id="send">${esc(TEXT.send)}</button><div class="muted" style="text-align:center">${esc(TEXT.stamp)}</div><div class="err" id="err" role="alert" hidden></div>` : ''}</div>`;
    const active = document.activeElement && document.activeElement.id;
    const pos = active === 'q' ? $('q').selectionStart : null;
    $('view').innerHTML = header + search + sel + order;
    if (active === 'q') { const q = $('q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { /* tipo sin selección */ } }
    wire();
}
function wire() {
    const q = $('q');
    if (q) q.addEventListener('input', () => { query = q.value; clearTimeout(timer); timer = setTimeout(search, 250); });
    $('view').querySelectorAll('[data-field]').forEach((b) => b.addEventListener('click', () => { field = b.getAttribute('data-field'); search(); }));
    $('view').querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => { const r = results[Number(b.getAttribute('data-pick'))]; picked = { ...r, qty: 1 }; view(); const qi = $('qty'); if (qi) { qi.focus(); qi.select(); } }));
    const qty = $('qty');
    if (qty) {
        qty.addEventListener('input', () => { picked.qty = qty.value; });
        $('dec').addEventListener('click', () => { picked.qty = Math.max(1, Math.round((Number(picked.qty) || 1) - 1)); qty.value = picked.qty; });
        $('inc').addEventListener('click', () => { picked.qty = Math.round((Number(picked.qty) || 0) + 1); qty.value = picked.qty; });
        $('add').addEventListener('click', addPicked);
        $('cancel').addEventListener('click', () => { picked = null; view(); });
    }
    $('view').querySelectorAll('[data-dec]').forEach((b) => b.addEventListener('click', () => { const c = cart[Number(b.getAttribute('data-dec'))]; c.quantity = Math.max(1, Math.round(c.quantity - 1)); view(); }));
    $('view').querySelectorAll('[data-inc]').forEach((b) => b.addEventListener('click', () => { const c = cart[Number(b.getAttribute('data-inc'))]; c.quantity = Math.round(c.quantity + 1); view(); }));
    $('view').querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { cart.splice(Number(b.getAttribute('data-rm')), 1); view(); }));
    const send = $('send');
    if (send) send.addEventListener('click', sendOrder);
}
function addPicked() {
    const n = Number(String(picked.qty).replace(',', '.'));
    if (!Number.isFinite(n) || n <= 0) { $('qty').focus(); return; }
    const found = cart.find((c) => c.id === picked.id);
    if (found) found.quantity = Math.round((found.quantity + n) * 1000) / 1000; else cart.push({ id: picked.id, code: picked.code, description: picked.description, uom: picked.uom, quantity: Math.round(n * 1000) / 1000 });
    picked = null;
    view();
}
async function search() {
    const my = ++seq;
    if (query.trim().length < 2) { results = []; total = 0; view(); return; }
    try {
        const res = await fetch(`${API}/search?q=${encodeURIComponent(query)}&fields=${field === 'all' ? '' : field}`, { cache: 'no-store' });
        if (my !== seq) return;
        if (!res.ok) { results = []; total = 0; view(); return; }
        const body = await res.json();
        results = body.items || [];
        total = body.total || 0;
    } catch (e) { results = []; total = 0; }
    if (my === seq) view();
}
async function sendOrder() {
    const err = $('err');
    const fail = (text) => { err.textContent = text; err.hidden = false; };
    err.hidden = true;
    const nameEl = $('name');
    const name = nameEl ? nameEl.value.replace(/\s+/g, ' ').trim() : '';
    if (!info.signedIn && !name) { fail(TEXT.needName); nameEl.focus(); return; }
    const btn = $('send');
    btn.disabled = true;
    btn.textContent = TEXT.sending;
    try {
        const res = await fetch(`${API}/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, items: cart.map((c) => ({ id: c.id, quantity: c.quantity })) }) });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
            btn.disabled = false; btn.textContent = TEXT.send;
            if (body.code === 'LOCKED') { info.locks.register = false; view(); return; }
            if (body.code === 'LOGIN') { info.locks.signin = true; info.signedIn = false; view(); return; }
            fail(body.code === 'NAME' ? TEXT.needName : (body.code === 'QTY' ? TEXT.errQty : (body.code === 'ITEMS' ? TEXT.errItems : (body.code === 'TOOMANY' ? TEXT.tooMany : TEXT.errGeneric))));
            return;
        }
        if (!info.signedIn) store.set(KEY_NAME, name);
        sentInfo = { folio: body.folio, name: body.name, createdAt: body.createdAt, lines: body.lines };
        cart = [];
        view();
    } catch (e) {
        btn.disabled = false; btn.textContent = TEXT.send;
        fail(TEXT.errGeneric);
    }
}
function viewSent() {
    const when = new Date(sentInfo.createdAt).toLocaleString(LANG === 'en' ? 'en-US' : 'es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    $('view').innerHTML = `<div class="card done"><div class="tick" aria-hidden="true">✓</div><h1>${esc(TEXT.sentTitle)}</h1><div class="muted">${esc(TEXT.folio)}</div><div class="folio">${esc(sentInfo.folio)}</div>
        <div>${esc(TEXT.by)}: <b>${esc(sentInfo.name)}</b></div><div>${esc(TEXT.at)}: <b>${esc(when)}</b></div><div class="muted">${esc(sentInfo.lines === 1 ? TEXT.item1 : TEXT.items.replace('{n}', sentInfo.lines))}</div>
        <button type="button" class="btn" id="again">${esc(TEXT.newOrder)}</button></div>`;
    $('again').addEventListener('click', () => { sentInfo = null; query = ''; results = []; total = 0; picked = null; view(); });
}

(async function init() {
    $('view').innerHTML = `<div class="card"><div class="muted">${esc(TEXT.loading)}</div></div>`;
    try {
        const res = await fetch(API, { cache: 'no-store' });
        if (!res.ok) throw new Error('not found');
        info = await res.json();
    } catch (err) { $('view').innerHTML = `<div class="card"><div class="err" role="alert">${esc(TEXT.notFound)}</div></div>`; return; }
    // el mismo encabezado del Layout: logo (o iniciales), tipo de página, Sitio y empresa
    window.QrBrandHeader.mount($('qr-brand'), { kind: TEXT.title, siteName: info.siteName, companyName: info.companyName, hasLogo: info.hasLogo, companyColor: info.companyColor, logoUrl: `/api/public/layout/${encodeURIComponent(TOKEN)}/logo` });
    view();
})();
})();
</script>
</body>
</html>
