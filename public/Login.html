<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.loginTitle">SGN by GEIPSA - Login</title>
    <link rel="icon" href="icons/icon-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-512.png">
    <meta name="theme-color" content="#3A4BC9">
    <link rel="stylesheet" href="Login.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</head>
<body>
    <!-- Native-app-only "unlock" screen: shown instead of the login form
         when (a) running inside the Capacitor app AND (b) a still-valid
         session already exists (see access-screen.js) — Face ID/fingerprint
         just locally re-confirms it's really the phone's owner before
         resuming that session; it never replaces the actual password login,
         which stays available as a fallback and is the only path when
         there's no existing session to unlock. Never shown in a plain
         browser tab (no window.Capacitor there). -->
    <div id="access-screen" class="access-screen" hidden>
        <div class="access-mark">
            <svg viewBox="0 0 1024 1024" width="100%" height="100%">
                <path d="M320 700 L320 470 Q320 320 512 320 Q704 320 704 470" stroke="#FFFFFF" stroke-width="72" fill="none" stroke-linecap="round"/>
                <circle cx="704" cy="560" r="62" fill="#FFFFFF"/>
                <circle cx="320" cy="700" r="62" fill="#7FE1FF"/>
            </svg>
        </div>
        <div class="access-name">SGN</div>
        <div class="access-tag" data-i18n="login.accessTagline">Sistema de Gestión de Negocios</div>
        <div class="access-spinner" id="access-spinner"></div>
        <button type="button" class="access-peek" id="access-peek" hidden aria-label="Show sign-in options">
            <i class="bx bx-chevron-up" aria-hidden="true"></i>
        </button>
        <div class="access-sheet" id="access-sheet" hidden>
            <p class="access-sheet-title" data-i18n="login.accessHow">¿Cómo quieres entrar?</p>
            <div class="access-sheet-icons">
                <button type="button" class="access-icon-opt primary" id="access-biometric-btn">
                    <span class="access-icon-circle"><i class="bx bx-scan" aria-hidden="true"></i></span>
                    <span class="access-icon-caption" id="access-biometric-label">Face ID</span>
                </button>
                <button type="button" class="access-icon-opt" id="access-password-btn">
                    <span class="access-icon-circle"><i class="bx bx-lock-alt" aria-hidden="true"></i></span>
                    <span class="access-icon-caption" data-i18n="login.accessWithPassword">Usuario y contraseña</span>
                </button>
            </div>
        </div>

        <!-- Shown while the native OS Face ID/fingerprint prompt is running
             (see attemptBiometric in access-screen.js) — purely cosmetic
             branding around that call; the actual scan is 100% handled by
             the phone's own sensor, nothing captured or stored here. -->
        <div class="access-scan-screen" id="access-scan-screen" hidden>
            <span class="access-scan-circle"><i class="bx bx-scan" aria-hidden="true"></i></span>
            <p class="access-scan-title" data-i18n="login.accessScanning">Mirando tu rostro...</p>
            <p class="access-scan-sub" id="access-scan-sub" data-i18n="login.accessScanningSub">Face ID de tu celular</p>
        </div>

        <!-- App-branded login (dark, matches this screen) — same
             /api/auth/login the web form uses, just a different look and
             reached only from here. Username/password are already the
             account's real Sistema Web credentials, nothing separate. -->
        <div class="access-password-screen" id="access-password-screen" hidden>
            <button type="button" class="access-pw-back" id="access-pw-back" aria-label="Back">
                <i class="bx bx-chevron-left" aria-hidden="true"></i>
            </button>
            <div class="access-mark access-pw-mark">
                <svg viewBox="0 0 1024 1024" width="100%" height="100%">
                    <path d="M320 700 L320 470 Q320 320 512 320 Q704 320 704 470" stroke="#FFFFFF" stroke-width="72" fill="none" stroke-linecap="round"/>
                    <circle cx="704" cy="560" r="62" fill="#FFFFFF"/>
                    <circle cx="320" cy="700" r="62" fill="#7FE1FF"/>
                </svg>
            </div>
            <p class="access-pw-title" data-i18n="login.loginHeading">Login</p>
            <form id="access-password-form" class="access-pw-form" novalidate>
                <div class="access-pw-field">
                    <i class="bx bxs-user" aria-hidden="true"></i>
                    <label for="access-pw-username" class="sr-only" data-i18n="login.usernameLabel">Username</label>
                    <input id="access-pw-username" type="text" autocomplete="username" data-i18n-placeholder="login.usernamePlaceholder" placeholder="Username" required>
                </div>
                <div class="access-pw-field">
                    <i class="bx bx-lock-alt" aria-hidden="true"></i>
                    <label for="access-pw-password" class="sr-only" data-i18n="login.passwordLabel">Password</label>
                    <input id="access-pw-password" type="password" autocomplete="current-password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="Password" required>
                    <button type="button" class="access-pw-toggle" id="access-pw-toggle" data-i18n-aria="login.showPassword" aria-label="Show password">
                        <i class="bx bx-hide" aria-hidden="true"></i>
                    </button>
                </div>
                <p id="access-pw-error" class="access-pw-error" role="alert" hidden></p>
                <button type="submit" class="access-btn" id="access-pw-submit">
                    <span data-i18n="login.loginButton">Login</span>
                </button>
            </form>
        </div>
    </div>

    <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Change language">EN / ES</button>

    <div id="form-error" class="form-error" role="alert" hidden></div>

    <div class="container">
        <div class="form-box login">
            <form id="login-form" novalidate>
                <h1 data-i18n="login.loginHeading">Login</h1>

                <div class="input-box">
                    <label for="login-username" class="sr-only" data-i18n="login.usernameLabel">Username</label>
                    <input id="login-username" name="username" type="text" autocomplete="username"
                           data-i18n-placeholder="login.usernamePlaceholder" placeholder="Username" required>
                    <i class="bx bxs-user" aria-hidden="true"></i>
                </div>

                <div class="input-box">
                    <label for="login-password" class="sr-only" data-i18n="login.passwordLabel">Password</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password"
                           data-i18n-placeholder="login.passwordPlaceholder" placeholder="Password" required minlength="8">
                    <button type="button" class="toggle-password" id="toggle-login-password"
                            data-i18n-aria="login.showPassword" aria-label="Show password">
                        <i class="bx bx-hide" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="forgot-link">
                    <a href="#" data-i18n="login.forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="btn" id="login-submit">
                    <span data-i18n="login.loginButton">Login</span>
                </button>

                <p data-i18n="login.orLoginWith">or login with social platforms</p>
                <div class="social-icons">
                    <a href="#" class="google" aria-label="Login with Google"><i class="bx bxl-google"></i></a>
                    <a href="#" class="facebook" aria-label="Login with Facebook"><i class="bx bxl-facebook"></i></a>
                    <a href="#" class="github" aria-label="Login with GitHub"><i class="bx bxl-github"></i></a>
                    <a href="#" class="linkedin" aria-label="Login with LinkedIn"><i class="bx bxl-linkedin"></i></a>
                    <a href="#" class="slack" aria-label="Login with Slack"><i class="bx bxl-slack"></i></a>
                    <a href="#" class="sgn-app" id="open-app-link" data-i18n-aria="login.openApp" aria-label="Open the SGN app"><img src="icons/icon-512.png" alt="SGN"></a>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <form id="register-form" novalidate>
                <h1 data-i18n="login.registerHeading">Registration</h1>

                <div class="input-box">
                    <label for="register-username" class="sr-only" data-i18n="login.usernameLabel">Username</label>
                    <input id="register-username" name="username" type="text" autocomplete="username"
                           data-i18n-placeholder="login.usernamePlaceholder" placeholder="Username" required>
                    <i class="bx bxs-user" aria-hidden="true"></i>
                </div>

                <div class="input-box">
                    <label for="register-email" class="sr-only" data-i18n="login.emailLabel">Email</label>
                    <input id="register-email" name="email" type="email" autocomplete="email"
                           data-i18n-placeholder="login.emailPlaceholder" placeholder="Email" required>
                    <i class="bx bxs-envelope" aria-hidden="true"></i>
                </div>

                <div class="input-box">
                    <label for="register-password" class="sr-only" data-i18n="login.passwordLabel">Password</label>
                    <input id="register-password" name="password" type="password" autocomplete="new-password"
                           data-i18n-placeholder="login.passwordPlaceholder" placeholder="Password" required minlength="8">
                    <button type="button" class="toggle-password" id="toggle-register-password"
                            data-i18n-aria="login.showPassword" aria-label="Show password">
                        <i class="bx bx-hide" aria-hidden="true"></i>
                    </button>
                </div>

                <button type="submit" class="btn" id="register-submit">
                    <span data-i18n="login.registerButton">Register</span>
                </button>

                <p data-i18n="login.orRegisterWith">or register with social platforms</p>
                <div class="social-icons">
                    <a href="#" class="google" aria-label="Register with Google"><i class="bx bxl-google"></i></a>
                    <a href="#" class="facebook" aria-label="Register with Facebook"><i class="bx bxl-facebook"></i></a>
                    <a href="#" class="github" aria-label="Register with GitHub"><i class="bx bxl-github"></i></a>
                    <a href="#" class="linkedin" aria-label="Register with LinkedIn"><i class="bx bxl-linkedin"></i></a>
                </div>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1 data-i18n="login.helloWelcome">Hello, welcome!</h1>
                <p data-i18n="login.noAccount">Don't have an account?</p>
                <button type="button" class="btn register-btn" data-i18n="login.registerButton">Register</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1 data-i18n="login.welcomeBack">Welcome back!</h1>
                <p data-i18n="login.alreadyHaveAccount">Already have an account?</p>
                <button type="button" class="btn login-btn" data-i18n="login.loginButton">Login</button>
            </div>
        </div>
    </div>

    <script src="login.js" defer></script>
    <script src="access-screen.js" defer></script>
</body>
</html>
