<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="business.accesosTitle">Access &amp; Permissions</title>
    <link rel="icon" href="Imagenes/Logo_Stickers.webp">
    <link rel="stylesheet" href="Inicio-en.css">
    <link rel="stylesheet" href="Admin.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body>
    <nav class="Sidebar" id="Sidebar" aria-label="Main navigation">
        <div class="header">
            <div class="menu-btn" id="menu-btn" role="button" tabindex="0"
                 aria-label="Collapse sidebar" aria-expanded="true">
                <i class="bx bx-chevron-left" aria-hidden="true"></i>
            </div>
            <div class="brand">
                <img class="brand-light" src="Imagenes/LogoSGN_F_Blanco.jfif" alt="SGN logo">
                <img class="brand-dark" src="Imagenes/LogoSGN.jfif" alt="SGN logo">
                <span data-i18n="sidebar.brand">SGN</span>
            </div>
        </div>

        <div class="menu-container">
            <div class="search">
                <i class="bx bx-search" aria-hidden="true"></i>
                <label for="sidebar-search" class="sr-only" data-i18n="sidebar.searchPlaceholder">Search</label>
                <input id="sidebar-search" type="search" data-i18n-placeholder="sidebar.searchPlaceholder" placeholder="Search" autocomplete="off">
            </div>

            <div class="dept-picker" id="dept-picker">
                <button type="button" class="dept-picker-btn" id="dept-picker-btn"
                        aria-haspopup="true" aria-expanded="false">
                    <i class="bx bx-buildings" aria-hidden="true"></i>
                    <span id="dept-picker-label" data-i18n="sidebar.department">Department</span>
                    <i class="bx bx-chevron-down" aria-hidden="true"></i>
                </button>
                <ul class="dept-picker-dropdown" id="dept-picker-dropdown" role="menu">
                    <!-- Department options are rendered at runtime -->
                </ul>
            </div>

            <div class="dept-picker" id="area-picker">
                <button type="button" class="dept-picker-btn" id="area-picker-btn"
                        aria-haspopup="true" aria-expanded="false">
                    <i class="bx bx-collection" aria-hidden="true"></i>
                    <span id="area-picker-label" data-i18n="sidebar.area">Area</span>
                    <i class="bx bx-chevron-down" aria-hidden="true"></i>
                </button>
                <ul class="dept-picker-dropdown" id="area-picker-dropdown" role="menu">
                    <!-- Area options are rendered at runtime -->
                </ul>
            </div>

            <div id="menu-mount" aria-live="polite">
                <!-- Sidebar sections are rendered here at runtime from data/menu.json -->
            </div>
        </div>

        <div class="footer">
            <ul class="menu" id="footer-menu-mount">
                <!-- Rendered at runtime from data/menu.json -->
            </ul>
            <div class="user">
                <div class="user-img">
                    <img id="user-avatar" src="Imagenes/User.jpg" alt="User avatar">
                </div>
                <div class="user-data">
                    <span class="name" id="user-name">&nbsp;</span>
                    <span class="email" id="user-email">&nbsp;</span>
                </div>
                <div class="user-icon">
                    <a href="Login.html" class="exit" id="logout-link" data-i18n-aria="sidebar.logout" aria-label="Log out">
                        <i class="bx bx-exit" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="top-bar barra-arriba">
            <div class="top-bar-title">
                <div class="cc-picker" id="cc-picker">
                    <button type="button" class="cc-picker-btn" id="cc-picker-btn"
                            aria-haspopup="true" aria-expanded="false">
                        <i class="bx bx-purchase-tag-alt" aria-hidden="true"></i>
                        <span id="cc-picker-label" data-i18n="sidebar.costCenters">Cost Centers</span>
                        <i class="bx bx-chevron-down" aria-hidden="true"></i>
                    </button>
                    <ul class="cc-picker-dropdown" id="cc-picker-dropdown" role="menu">
                        <!-- Cost center options are rendered at runtime -->
                    </ul>
                </div>
                <p class="welcome-text" data-i18n="business.accesosTitle">Access &amp; Permissions</p>
            </div>
            <div class="top-bar-actions" id="top-bar-actions">
                <button type="button" class="top-bar-actions-toggle" id="top-bar-actions-toggle"
                        aria-label="More" aria-haspopup="true" aria-expanded="false">
                    <i class="bx bx-dots-vertical-rounded" aria-hidden="true"></i>
                </button>
                <div class="sidebars-btn" id="sidebars-btn" role="button" tabindex="0"
                     aria-label="Toggle sidebar" aria-expanded="false">
                    <i class="bx bx-menu" aria-hidden="true"></i>
                    <i class="bx bx-x" aria-hidden="true"></i>
                </div>
                <div class="top-bar-actions-list" id="top-bar-actions-list">
                    <button type="button" data-i18n-aria="main.messages" aria-label="Messages">
                        <i class="bx bx-message" aria-hidden="true"></i>
                    </button>
                    <button type="button" data-i18n-aria="main.notifications" aria-label="Notifications">
                        <i class="bx bx-bell" aria-hidden="true"></i>
                    </button>
                    <button type="button" data-i18n-aria="main.bookmarks" aria-label="Bookmarks">
                        <i class="bx bx-bookmarks" aria-hidden="true"></i>
                    </button>
                    <div class="settings-menu" id="settings-menu">
                        <button type="button" data-i18n-aria="main.settings" aria-label="Settings" id="settings-btn"
                                aria-haspopup="true" aria-expanded="false">
                            <i class="bx bx-cog" aria-hidden="true"></i>
                        </button>
                        <ul class="settings-dropdown" id="settings-dropdown" role="menu">
                            <li role="none" class="settings-dropdown-group" id="language-group">
                                <button type="button" class="settings-dropdown-toggle" id="language-toggle-btn"
                                        aria-haspopup="true" aria-expanded="false">
                                    <i class="bx bx-globe" aria-hidden="true"></i>
                                    <span data-i18n="main.language">Language</span>
                                    <i class="bx bx-chevron-down" aria-hidden="true"></i>
                                </button>
                                <ul class="settings-submenu" id="language-submenu" role="menu">
                                    <li role="none">
                                        <button type="button" role="menuitem" class="lang-option active" data-lang="en">
                                            <i class="bx bx-globe" aria-hidden="true"></i>
                                            <span data-i18n="main.languageEnglish">English</span>
                                        </button>
                                    </li>
                                    <li role="none">
                                        <button type="button" role="menuitem" class="lang-option" data-lang="es">
                                            <i class="bx bx-globe" aria-hidden="true"></i>
                                            <span data-i18n="main.languageSpanish">Spanish</span>
                                        </button>
                                    </li>
                                </ul>
                            </li>
                            <li role="none" class="settings-dropdown-group" id="style-group">
                                <button type="button" class="settings-dropdown-toggle" id="style-toggle-btn"
                                        aria-haspopup="true" aria-expanded="false">
                                    <i class="bx bx-palette" aria-hidden="true"></i>
                                    <span data-i18n="main.style">Style</span>
                                    <i class="bx bx-chevron-down" aria-hidden="true"></i>
                                </button>
                                <ul class="settings-submenu" id="style-submenu" role="menu">
                                    <li role="none">
                                        <button type="button" role="menuitem" class="style-option active" data-style="light">
                                            <i class="bx bx-sun" aria-hidden="true"></i>
                                            <span data-i18n="main.styleLight">Light</span>
                                        </button>
                                    </li>
                                    <li role="none">
                                        <button type="button" role="menuitem" class="style-option" data-style="dark">
                                            <i class="bx bx-moon" aria-hidden="true"></i>
                                            <span data-i18n="main.styleDark">Dark</span>
                                        </button>
                                    </li>
                                    <li role="none">
                                        <button type="button" role="menuitem" class="style-option" data-style="institutional">
                                            <i class="bx bx-buildings" aria-hidden="true"></i>
                                            <span data-i18n="main.styleInstitutional">Institutional</span>
                                        </button>
                                    </li>
                                </ul>
                            </li>
                            <li role="none" class="settings-dropdown-group" id="business-admin-group" hidden>
                                <button type="button" class="settings-dropdown-toggle" id="business-admin-toggle-btn"
                                        aria-haspopup="true" aria-expanded="false">
                                    <i class="bx bx-shopping-bag" aria-hidden="true"></i>
                                    <span data-i18n="menu.adminBusiness">Admin Business</span>
                                    <i class="bx bx-chevron-down" aria-hidden="true"></i>
                                </button>
                                <ul class="settings-submenu" id="business-admin-submenu" role="menu">
                                    <!-- Administración del Negocio items rendered at runtime -->
                                </ul>
                            </li>
                            <li role="none">
                                <button type="button" role="menuitem" id="settings-others">
                                    <i class="bx bx-dots-horizontal-rounded" aria-hidden="true"></i>
                                    <span data-i18n="main.others">Others</span>
                                </button>
                            </li>
                        </ul>
                    </div>
                    <button type="button" data-i18n-aria="main.addUser" aria-label="Add user">
                        <i class="bx bx-user-plus" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>

        <section class="admin-panel">
            <p class="admin-subtitle" data-i18n="business.accesosSubtitle">Grant a user extra modules, sections, or screens beyond what their profile(s) already give them.</p>

            <div class="admin-select-row">
                <label for="access-user-select" data-i18n="business.selectUserForAccess">Select a user</label>
                <select id="access-user-select">
                    <option value="" data-i18n="business.selectUserPlaceholder">Choose a user...</option>
                </select>
            </div>

            <p id="access-hint" class="admin-hint" data-i18n="business.noUserSelected">Select a user above to manage their profiles.</p>

            <div id="access-panel" hidden>
                <p class="admin-subtitle" data-i18n="business.extraAccessHint">This is in addition to whatever their assigned profiles already grant — it never removes access.</p>
                <div id="permission-tree-container"></div>
                <div class="admin-form-actions" style="margin-top: 1.25rem;">
                    <button type="button" class="btn" id="access-save" data-i18n="admin.save">Save</button>
                </div>
                <p id="access-save-status" class="admin-save-status"></p>
            </div>
        </section>
    </main>

    <script src="Dashboard.js"></script>
    <script src="ColorPalette.js"></script>
    <script src="PermissionTree.js"></script>
    <script src="Business-Accesos.js"></script>
</body>
</html>
